<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="description" content="Nutrition and macro tracker for gradual fat loss. All data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Macro Tracker</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f7f8fa; --border:#e3e6eb;
  --text:#14171f; --text-2:#5b6472; --text-3:#8a93a2;
  --accent:#2f6df6; --accent-soft:#e8f0ff;
  --cal:#f0803c; --pro:#2f6df6; --carb:#12a594; --fat:#b86bd8; --fib:#7a9a3c;
  --good:#1a8a4a; --warn:#c77700; --over:#c63b3b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --r:16px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  /* status bar / Dynamic Island. Zero in a normal browser tab; ~50–60px when
     the page runs as a Home Screen app with a translucent status bar, where
     the layout otherwise starts underneath the clock. */
  --safe-t:env(safe-area-inset-top,0px);
}
/* Real dark mode: a true-black base rather than a dark-blue "night" tint.
   Depth comes from surfaces stepping up in lightness, the way iOS and
   Material 3 do it, not from shadows — shadows are invisible on black.
   Every text/background pair below clears WCAG AA (4.5:1) and the primary
   text pair clears AAA. */
html[data-theme="dark"]{
  --bg:#000000;            /* true black: deep on OLED, saves power */
  --surface:#121214;       /* elevation 1 */
  --surface-2:#1e1e21;     /* elevation 2 — inputs, chips, bar tracks */
  --border:#323236;
  --text:#f5f5f7;          /* 19.8:1 on bg */
  --text-2:#a8a8b0;        /* 8.2:1 on surface */
  --text-3:#8a8a92;        /* 5.6:1 on surface */
  --accent:#409cff; --accent-soft:#11253f;
  --cal:#ff9f0a; --pro:#5ea0ff; --carb:#2dd4bf; --fat:#d08cf5; --fib:#a8d84a;
  --good:#32d74b; --warn:#ffd426; --over:#ff453a;
  /* a hairline lift instead of a drop shadow */
  --shadow:0 0 0 0.5px rgba(255,255,255,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + var(--safe-b));
}
body.no-nav{padding-bottom:0}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.02em}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.screen{display:none;padding-top:14px}
.screen.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* header */
/* sticky at the true top of the screen, padded down past the status bar, so
   its background also covers the bar while the page scrolls beneath it */
.apphead{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + var(--safe-t)) 0 8px;
  border-bottom:1px solid transparent;transition:border-color .2s}
.apphead.scrolled{border-color:var(--border)}
.apphead .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.date-nav{display:flex;align-items:center;gap:6px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:650}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:11px 15px;font-weight:600;font-size:15px;min-height:44px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13.5px;border-radius:10px}
.btn.icon{padding:0;width:40px;min-height:40px;border-radius:11px}
.btn.wide{width:100%}
.btn.danger{color:var(--over);border-color:var(--border)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));z-index:35;
  background:var(--accent);color:#fff;border:none;border-radius:30px;padding:14px 20px;
  font-weight:700;font-size:15.5px;box-shadow:0 6px 20px rgba(47,109,246,.4);display:flex;gap:8px;align-items:center}
.fab:active{transform:scale(.96)}

/* forms */
.field{margin-bottom:13px}
.field label,.lbl{display:block;font-size:13px;font-weight:650;color:var(--text-2);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--text-3);margin-top:5px;line-height:1.4}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:12px 13px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238a93a2' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:none;border-radius:8px;padding:9px 6px;font-size:14px;
  font-weight:600;color:var(--text-2);min-height:38px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
html[data-theme="dark"] .seg button.on{background:var(--accent);color:#fff}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:11px;background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:12px;padding:12px 13px;text-align:left;width:100%}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
html[data-theme="dark"] .choice.on{background:var(--accent-soft)}
.choice .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--text-3);margin-top:2px;position:relative}
.choice.on .dot{border-color:var(--accent)}
.choice.on .dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.choice b{display:block;font-size:14.5px;font-weight:650}
.choice span{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px}
.switch{position:relative;width:48px;height:29px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:30px;transition:background .18s}
.switch .track:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track:before{transform:translateX(19px)}

/* macro ring + bars */
.rings{display:flex;gap:14px;align-items:center}
.ring-main{flex:0 0 auto}
.ring-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.kcal-num{font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1}
.kcal-sub{font-size:12.5px;color:var(--text-2);margin-top:3px}
.bar-row{display:block}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.bar-name{font-size:13px;font-weight:650}
.bar-val{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative;border:1px solid var(--border)}
.bar i{display:block;height:100%;border-radius:6px;transition:width .45s cubic-bezier(.22,1,.36,1)}
.bar i.over{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 5px,transparent 5px 10px)}
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;margin-top:14px}
.macro-grid.three > .bar-row:nth-child(3){grid-column:span 2}
.remain{font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--text-2)}
.remain.over{color:var(--over);font-weight:600}
.remain.good{color:var(--good);font-weight:600}
.remain.warn{color:var(--warn)}

/* meals */
.meal{margin-bottom:12px}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}
.meal-h .t{display:flex;align-items:center;gap:8px}
.meal-h .kc{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-top:1px solid var(--border);text-align:left;width:100%;background:none;border-left:none;border-right:none;border-bottom:none}
.item:first-child{border-top:none}
.item .info{flex:1;min-width:0}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .kc{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;flex:0 0 auto}
.empty{color:var(--text-3);font-size:13.5px;padding:8px 4px;text-align:center}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);vertical-align:middle}
.badge.est{background:#fff4e2;color:#a56600;border-color:#f3dfc0}
html[data-theme="dark"] .badge.est{background:#33280f;color:#e8b45c;border-color:#4a3a18}
.badge.rec{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);display:flex}
.nav button{flex:1;background:none;border:none;padding:8px 2px 7px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--text-3);font-size:10.5px;font-weight:650;min-height:56px}
.nav button.on{color:var(--accent)}
.nav svg{width:23px;height:23px}

/* modal / sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,13,20,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -6px 30px rgba(0,0,0,.18)}
.sheet.open{transform:none}
@media(min-width:721px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:640px;max-width:92vw;border-radius:18px;
    transform:translate(-50%,-44%) scale(.97);opacity:0;max-height:88vh}
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.sheet-b{padding:14px 16px calc(18px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--border);display:flex;gap:9px;background:var(--surface);border-radius:0 0 18px 18px}
.sheet-f .btn{flex:1}
.grab{width:36px;height:4px;border-radius:3px;background:var(--border);margin:8px auto -4px}
.x{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-2);line-height:1}

/* lists */
.srch-res{display:flex;flex-direction:column;max-height:none}
.res{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border);
  background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%}
.res .nm{overflow-wrap:anywhere}
.res [data-quick]{flex:0 0 auto;white-space:nowrap}
.res .info{flex:1;min-width:0}
.res .nm{font-size:15px;font-weight:600}
.res .sub{font-size:12.5px;color:var(--text-2)}
.star{background:none;border:none;font-size:18px;padding:4px;line-height:1;color:var(--text-3)}
.star.on{color:#f0a63c}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:7px 13px;
  font-size:13.5px;font-weight:600;color:var(--text-2);min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.portion-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.pchip{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600}
.pchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pchip.mine{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.badge.mine{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:650;font-variant-numeric:tabular-nums}
.note{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:9px;padding:11px 13px;font-size:13.5px;color:var(--text-2);line-height:1.5}
.coach-line{display:flex;gap:9px;padding:9px 0;font-size:14.5px;line-height:1.45;border-bottom:1px solid var(--border)}
.coach-line:last-child{border-bottom:none}
.coach-line .ic{flex:0 0 auto;font-size:15px;line-height:1.4}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:11px;color:var(--text-3);font-weight:650;padding-bottom:4px}
.cal-cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;padding:0}
.cal-cell.blank{border:none;background:none}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-cell .d{width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.cal-cell.met .d{background:var(--good)}
.cal-cell.overd .d{background:var(--over)}
.cal-cell.sel .d{background:#fff}
.cal-cell.none{opacity:.45}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
.stat .l{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .n{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px}
.stat .s{font-size:11.5px;color:var(--text-3)}
.chartbox{width:100%;overflow:hidden}
.ing-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.ing-row .info{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(148px + var(--safe-b));
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.top{bottom:auto;top:calc(18px + var(--safe-t));transform:translateX(-50%) translateY(-20px)}

/* --- dark-mode refinements --- */
html[data-theme="dark"] .nav{background:rgba(18,18,20,.82)}
html[data-theme="dark"] .sheet{box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -20px 60px rgba(0,0,0,.8)}
html[data-theme="dark"] .sheet-bg{background:rgba(0,0,0,.65)}
html[data-theme="dark"] .fab{box-shadow:0 6px 24px rgba(64,156,255,.28)}
html[data-theme="dark"] .switch .track:before{background:#f5f5f7}
html[data-theme="dark"] .badge{background:#1e1e21;border-color:#323236}
html[data-theme="dark"] .card{box-shadow:none}
html[data-theme="dark"] .bar{border-color:#2a2a2e}
html[data-theme="dark"] .toast{background:#2c2c30;color:#f5f5f7;
  box-shadow:0 8px 28px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.08)}
html[data-theme="dark"] select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238a8a92' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>")}
html[data-theme="dark"] .star.on{color:#ffd426}
.toast.top.show{transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.spacer{height:10px}
@media(min-width:721px){
  body{padding-bottom:20px}
  .nav{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--border);
    max-width:720px;margin:0 auto;border-radius:0 0 14px 14px}
  .fab{bottom:24px}
  .macro-grid{grid-template-columns:repeat(3,1fr)}
  .macro-grid.three > .bar-row:nth-child(3){grid-column:auto}
  .toast.top{top:calc(24px + var(--safe-t))}
}
</style>
</head>
<body>

<div id="app"></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-h"><h3 id="sheetTitle">—</h3><button class="x" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f" id="sheetFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   MACRO TRACKER — core: storage, nutrition math, food library
   All nutrition is stored per a food's reference amount+unit.
   Entry multiplier = (qty * unitFactor) / refAmount
   ============================================================ */
'use strict';

const KEY = 'macrotracker.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const MEALS = ['breakfast', 'lunch', 'dinner', 'snacks'];
const MEAL_LABEL = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snacks: 'Snacks' };
const MACROS = ['calories', 'protein', 'carbs', 'fat', 'fiber'];

/* ---------- small helpers ---------- */
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const r0 = n => Math.round(n);
const r1 = n => Math.round(n * 10) / 10;
const fmt = n => r0(n).toLocaleString();
const fmtG = n => (Math.abs(n) < 10 ? r1(n) : r0(n)).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayKey = () => dkey(new Date());
function dkey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function shiftKey(k, days) { const d = parseKey(k); d.setDate(d.getDate() + days); return dkey(d); }
function prettyDate(k) {
  const d = parseKey(k), t = todayKey();
  if (k === t) return 'Today';
  if (k === shiftKey(t, -1)) return 'Yesterday';
  if (k === shiftKey(t, 1)) return 'Tomorrow';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: sameYear ? undefined : 'numeric' });
}

  const o = { ...a };

/* ============================================================
   TARGET CALCULATION  (Mifflin-St Jeor)
   ============================================================ */
const ACTIVITY = {
  sedentary: { mult: 1.2, label: 'Sedentary', desc: 'Desk job, little movement outside workouts' },
  light: { mult: 1.375, label: 'Lightly active', desc: 'Some walking, light daily activity' },
  moderate: { mult: 1.55, label: 'Moderately active', desc: 'On your feet a fair amount' },
  very: { mult: 1.725, label: 'Very active', desc: 'Physical job or lots of daily movement' }
};
const RATES = [
  { v: 0.25, label: 'Very gradual', desc: '~0.25 kg (0.5 lb) per week — easiest to sustain' },
  { v: 0.45, label: 'Steady (recommended)', desc: '~0.45 kg (1 lb) per week — good balance for keeping muscle' },
  { v: 0.7, label: 'Faster', desc: '~0.7 kg (1.5 lb) per week — harder to sustain, more muscle risk' }
];

function calcBMR(p) {
  // Mifflin-St Jeor: 10*kg + 6.25*cm - 5*age + (5 male / -161 female)
  const base = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age;
  return base + (p.sex === 'male' ? 5 : -161);
}
function activityMultiplier(p) {
  const base = (ACTIVITY[p.activity] || ACTIVITY.light).mult;
  // small upward nudge for training days, capped so it can't run away
  const bump = clamp(num(p.exerciseDays, 0), 0, 7) * 0.011;
  return clamp(base + bump, 1.2, 1.95);
}
/* Absolute lower bound. Sustained intakes below this are very-low-calorie
   territory, which needs medical supervision — the app won't set one. */
const HARD_MIN_KCAL = 1200;

/* The reference weight protein is scaled from. Goal weight is used when it is
   lower than current weight, so a large amount of fat mass doesn't inflate the
   target — but it is bounded below at 80% of current weight so an aggressive
   goal weight can't quietly drag the protein floor down with it. */
function proteinRefKg(p) {
  const cur = num(p.weightKg, 0);
  const goal = num(p.goalWeightKg, 0);
  if (!goal || goal >= cur) return cur;
  return Math.max(goal, cur * 0.8);
}

function computeTargets(p) {
  const bmr = calcBMR(p);
  const tdee = bmr * activityMultiplier(p);
  const rate = num(p.rate, 0.45);                 // kg per week
  let deficit = (rate * 7700) / 7;                // ~7700 kcal per kg
  deficit = Math.min(deficit, tdee * 0.25);       // never more than 25% below maintenance
  let calories = tdee - deficit;

  // floors: don't go below ~1.1x BMR, and respect a sensible absolute floor
  const floor = Math.max(bmr * 1.1, p.sex === 'male' ? 1500 : 1200);
  calories = Math.max(calories, floor);

  // A manual target overrides the calculation, but never silently below the
  // hard minimum, and the caller is told when it sits under the computed floor.
  let manualBelowFloor = false, manualClamped = false;
  if (p.manualCalories) {
    const m = num(p.manualCalories, calories);
    if (m < HARD_MIN_KCAL) { calories = HARD_MIN_KCAL; manualClamped = true; manualBelowFloor = true; }
    else { calories = m; manualBelowFloor = m < floor * 0.95; }   // floor is an estimate, allow slack
  }

  // Protein is a floor, not a leftover: it is set from bodyweight first and the
  // remaining energy is divided between fat and carbs afterwards.
  const refKg = proteinRefKg(p);
  const a = allocateMacros(calories, refKg);
  const fiber = clamp((calories / 1000) * 14, 20, 45);
  return {
    bmr: r0(bmr), tdee: r0(tdee), deficit: r0(tdee - calories),
    calories: r0(calories), protein: a.protein, carbs: a.carbs, fat: a.fat,
    fiber: r0(fiber), custom: false,
    floor: r0(floor), proteinRefKg: r1(refKg), manualBelowFloor, manualClamped,
    proteinReduced: a.proteinReduced, incoherent: a.incoherent, minCoherentKcal: a.minCoherentKcal,
    // the bodyweight these numbers were derived from — TDEE falls as weight
    // does, so the app can tell when the plan has drifted from the person
    atWeightKg: r1(p.weightKg), computedAt: Date.now()
  };
}

/* ------------------------------------------------------------
   MACRO ALLOCATION — a constrained budget, not a chain of clamps.

   The earlier version set protein, then fat, then took carbs as the
   remainder and finally forced carbs up to a floor of 40 g. When the
   calorie target was low relative to bodyweight that last step invented
   energy: a 120 kg reference at 1,200 kcal produced 150P/40C/72F, which
   is 1,408 kcal of macros against a 1,200 kcal budget — targets that
   cannot all be met at once.

   This allocator instead starts every macro at its floor, checks the
   floors actually fit inside the budget, and then spends the surplus in
   priority order. The result always sums to the calorie target.
   Priority: protein to 1.8 g/kg -> carbs to 50 g -> fat to its target
   -> everything left to carbs (this app's staples are carb-heavy).
   ------------------------------------------------------------ */
function allocateMacros(calories, refKg) {
  const P_WANT = 1.8 * refKg, P_MIN = 1.2 * refKg;
  const F_WANT = Math.max(0.8 * refKg, (calories * 0.2) / 9), F_MIN = 0.45 * refKg;
  const C_WANT = 50, C_MIN = 25;
  const floorE = P_MIN * 4 + F_MIN * 9 + C_MIN * 4;   // energy at all floors

  let protein, fat, carbs, incoherent = false;
  if (calories <= floorE) {
    // The target cannot cover even the minimums. Rather than manufacture
    // macros that exceed it, scale the floors down together and flag it so
    // the UI can say the calorie target is too low for this bodyweight.
    const s = calories / floorE;
    protein = P_MIN * s; fat = F_MIN * s; carbs = C_MIN * s;
    incoherent = true;
  } else {
    protein = P_MIN; fat = F_MIN; carbs = C_MIN;
    let rem = calories - floorE;
    const spend = (extraGrams, kcalPerGram) => {
      const cost = Math.max(extraGrams, 0) * kcalPerGram;
      const use = Math.min(rem, cost);
      rem -= use;
      return use / kcalPerGram;
    };
    protein += spend(P_WANT - P_MIN, 4);
    carbs += spend(C_WANT - C_MIN, 4);
    fat += spend(F_WANT - F_MIN, 9);
    carbs += rem / 4;                                  // remainder to carbs
  }

  // Round for display, then derive carbs from what is actually left so the
  // three macros still add up to the calorie target after rounding.
  const P = Math.max(0, r0(protein)), F = Math.max(0, r0(fat));
  const C = Math.max(0, r0((calories - P * 4 - F * 9) / 4));
  return {
    protein: P, fat: F, carbs: C,
    proteinReduced: protein < P_WANT - 0.5,
    incoherent, minCoherentKcal: Math.ceil(floorE)
  };
}

const defaultDB = () => ({
  version: 1,
  profile: null,
  targets: null,
  days: {},

  savedMeals: [],

/* ---------- deleting a food ----------
   Logged entries, recipe ingredients and saved meals are all snapshots, so
   removing a food never rewrites anything already recorded. Only the food's
   own personal portions go with it. Starter foods are remembered by id so
   the forward-compat re-seed in load() doesn't quietly bring them back. */
function deleteFood(foodId) {
  const f = DB.foods.find(x => x.id === foodId);
  if (!f) return false;
  DB.foods = DB.foods.filter(x => x.id !== foodId);
  if (f.lib) {
    if (!Array.isArray(DB.deletedLib)) DB.deletedLib = [];
    if (!DB.deletedLib.includes(foodId)) DB.deletedLib.push(foodId);
  }
  if (DB.myPortions) delete DB.myPortions[foodId];
  return true;
}

/* ---------- personal portions ----------
   "My usual eba = 80 g dry garri". Keyed by food id so it follows the food,
   and kept out of the food object itself so restoring starter foods doesn't
   wipe them. */
function portionsFor(foodId) { return (DB.myPortions && DB.myPortions[foodId]) || []; }
function defaultPortion(foodId) {
  const list = portionsFor(foodId);
  return list.find(p => p.fav) || list[0] || null;
}
/* A food's units can change after a portion was saved — a recipe's servings
   were edited, or a custom food's unit list was rebuilt. makeEntry would
   silently fall back to the food's FIRST unit, which can be out by orders of
   magnitude (350 "servings" instead of 350 g). So a portion is only usable
   while the unit it was saved against still exists. */
function usablePortion(food, mp) {
  if (!food || !mp) return null;
  return (food.units || []).some(u => u.name === mp.unit) ? mp : null;
}
function defaultUsablePortion(food) {
  return food ? usablePortion(food, defaultPortion(food.id)) : null;
}
function addMyPortion(foodId, label, qty, unit) {
  if (!DB.myPortions) DB.myPortions = {};
  if (!DB.myPortions[foodId]) DB.myPortions[foodId] = [];
  const list = DB.myPortions[foodId];
  const existing = list.find(p => p.label.toLowerCase() === label.toLowerCase());
  if (existing) { existing.qty = qty; existing.unit = unit; return existing; }
  const p = { id: 'mp_' + uid(), label, qty, unit, fav: list.length === 0 };
  list.push(p);
  return p;
}
function removeMyPortion(foodId, portionId) {
  if (!DB.myPortions || !DB.myPortions[foodId]) return;
  DB.myPortions[foodId] = DB.myPortions[foodId].filter(p => p.id !== portionId);
  const left = DB.myPortions[foodId];
  if (left.length && !left.some(p => p.fav)) left[0].fav = true;
  if (!left.length) delete DB.myPortions[foodId];
}

let DB = defaultDB();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    DB = Object.assign(defaultDB(), parsed);
    DB.settings = Object.assign({ theme: 'system', units: 'metric' }, parsed.settings || {});
    // re-seed any library foods the user hasn't deleted/edited (forward compat)
    const have = new Set((DB.foods || []).map(f => f.id));
    starterFoods().forEach(f => { if (!have.has(f.id) && !(DB.deletedLib || []).includes(f.id)) DB.foods.push(f); });
    // targets saved before the app recorded their reference weight: the profile
    // weight is the closest thing available, so drift is measured from here on
    if (DB.targets && DB.profile && DB.targets.atWeightKg == null) DB.targets.atWeightKg = r1(num(DB.profile.weightKg));
    return true;
  } catch (e) { console.warn('load failed', e); return false; }
}
let saveTimer = null;
function save(immediate) {
  const doIt = () => {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch (e) { toast('Could not save — storage may be full'); console.error(e); }
  };
  if (immediate) { clearTimeout(saveTimer); doIt(); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(doIt, 120);
}

function day(k) {
  if (!DB.days[k]) DB.days[k] = { entries: [], weight: null };
  if (!DB.days[k].entries) DB.days[k].entries = [];
  return DB.days[k];
}
const dayOrNull = k => DB.days[k] || null;

/* ------------------------------------------------------------
   PER-DAY TARGET SNAPSHOTS

   Targets change as you lose weight. Without a snapshot every past day
   is re-judged against today's numbers, so recalculating in November
   could retroactively mark a compliant September day as "over target"
   and move your historical hit-rate — without a single food entry
   changing. A day therefore records the targets that applied to it.
   ------------------------------------------------------------ */
function snapshotTargets(t) {
  const o = {};
  MACROS.forEach(m => o[m] = t[m]);
  o.tdee = t.tdee;
  return o;
}
/* Called whenever a day gains its first entry. Today keeps following the
   live targets (see refreshTodayTargets) — a day is only frozen once it
   is in the past. */
function stampDay(k) {
  const d = day(k);
  if (!d.targets && DB.targets) d.targets = snapshotTargets(DB.targets);
  return d;
}
/* The targets a given date should be judged against. */
function targetsFor(k) {
  if (k === todayKey()) return DB.targets;
  const d = DB.days[k];
  return (d && d.targets) ? d.targets : DB.targets;
}
/* True when a past day predates snapshots and is being judged against
   current targets — the UI says so rather than implying false precision. */
function usesFallbackTargets(k) {
  if (k === todayKey()) return false;
  const d = DB.days[k];
  return !!(d && d.entries && d.entries.length && !d.targets);
}
/* Today's plan is whatever the targets are now, so keep its snapshot in
   step when they change. */
function refreshTodayTargets() {
  const k = todayKey();
  if (DB.days[k] && DB.days[k].targets && DB.targets) DB.days[k].targets = snapshotTargets(DB.targets);
}

/* ============================================================
   ENTRY MATH
   An entry is a self-contained snapshot so that later edits to a
   food definition never silently rewrite history.
   ============================================================ */
function makeEntry(food, qty, unitName, meal) {
  const u = (food.units || []).find(x => x.name === unitName) || food.units[0];
  return {
    id: uid(), meal,
    foodId: food.id || null,
    name: food.name,
    qty: num(qty, 1),
    unit: u.name,
    factor: num(u.factor, 1),
    refAmount: num(food.ref.amount, 100),
    refUnit: food.ref.unit,
    nutr: { ...food.nutr },
    estimate: !!food.estimate,
    kind: food.kind || 'food',
    at: Date.now()
  };
}
const entryMult = e => (num(e.qty, 0) * num(e.factor, 1)) / num(e.refAmount, 100);
function entryNutr(e) {
  const m = entryMult(e), o = zero();
  MACROS.forEach(k => { o[k] = (e.nutr[k] || 0) * m; });
  return o;
}
function dayTotals(k) {
  const d = dayOrNull(k);
  let t = zero();
  if (!d) return t;
  d.entries.forEach(e => { const n = entryNutr(e); MACROS.forEach(m => t[m] += n[m]); });
  return t;
}
function mealTotals(k, meal) {
  const d = dayOrNull(k); let t = zero();
  if (!d) return t;
  d.entries.filter(e => e.meal === meal).forEach(e => { const n = entryNutr(e); MACROS.forEach(m => t[m] += n[m]); });
  return t;
}
function remaining(k) {
  const t = dayTotals(k), g = targetsFor(k), o = {};
  MACROS.forEach(m => { o[m] = (g ? g[m] : 0) - t[m]; });
  return o;
}
function describeServing(e) {
  const q = num(e.qty, 0);
  const qs = (Math.abs(q - Math.round(q)) < 0.01 ? Math.round(q) : r1(q)).toString();
  // "100 g", "250 ml", "90 g dry garri" read naturally; "2 × large egg" needs the ×
  return /^(g|ml|oz|kg|lb)(\s|$)/.test(e.unit) ? `${qs} ${e.unit}` : `${qs} × ${e.unit}`;
}
function bumpUsage(foodId) {
  if (!foodId) return;
  DB.usage[foodId] = { n: (DB.usage[foodId]?.n || 0) + 1, last: Date.now() };
}

/* ---------- search across foods, recipes, saved meals ---------- */
function searchAll(q) {
  const s = q.trim().toLowerCase();
  const score = (name, item) => {
    const n = name.toLowerCase();
    if (!s) return (DB.usage[item.id]?.n || 0) * 2 + (item.favorite ? 50 : 0);
    if (n === s) return 1000;
    if (n.startsWith(s)) return 500 + (DB.usage[item.id]?.n || 0);
    if (n.includes(s)) return 200 + (DB.usage[item.id]?.n || 0);
    const words = n.split(/[^a-z0-9]+/);
    if (words.some(w => w.startsWith(s))) return 150;
    return -1;
  };
  const out = [];
  DB.savedMeals.forEach(m => { const sc = score(m.name, m); if (sc >= 0) out.push({ type: 'meal', item: m, sc: sc + 30 }); });
  DB.recipes.forEach(r => { const sc = score(r.name, r); if (sc >= 0) out.push({ type: 'recipe', item: r, sc: sc + 20 }); });
  DB.foods.forEach(f => {
    const sc = score(f.name, f);
    if (sc >= 0) out.push({ type: 'food', item: f, sc: sc + (f.custom ? 15 : 0) + (f.favorite ? 40 : 0) });
  });
  return out.sort((a, b) => b.sc - a.sc);
}
function recentFoods(limit = 12) {
  const ids = Object.entries(DB.usage).sort((a, b) => (b[1].last || 0) - (a[1].last || 0)).map(x => x[0]);
  const out = [];
  for (const id of ids) {
    const f = DB.foods.find(x => x.id === id) || DB.recipes.find(x => x.id === id);
    if (f) out.push(f);
    if (out.length >= limit) break;
  }
  return out;
}

/* ---------- recipes -> food-like object ---------- */
function recipeToFood(r) {
  const per = r.perServing || zero();
  const units = [{ name: 'serving', factor: 1 }];
  if (r.servingWeight) {
    units.push({ name: `g (1 serving = ${r0(r.servingWeight)} g)`, factor: 1 / r.servingWeight });
    units.push({ name: `half serving`, factor: 0.5 });
  } else {
    units.push({ name: 'half serving', factor: 0.5 });
  }
  return {
    id: r.id, name: r.name, ref: { amount: 1, unit: 'serving' }, nutr: per,
    units, estimate: !!r.estimate, kind: 'recipe', note: r.note
  };
}
function recipeTotals(r) {
  let t = zero();
  (r.ingredients || []).forEach(ing => { const n = entryNutr(ing); MACROS.forEach(m => t[m] += n[m]); });
  return t;
}
function recomputeRecipe(r) {
  const total = recipeTotals(r);
  const servings = Math.max(num(r.servings, 1), 0.01);
  r.total = total;
  r.perServing = {};
  MACROS.forEach(m => { r.perServing[m] = total[m] / servings; });
  if (r.totalWeight) r.servingWeight = num(r.totalWeight) / servings;
  r.estimate = (r.ingredients || []).some(i => i.estimate);
  return r;
}

  const s = sheetStack[sheetStack.length - 1];
  if (!s) return;
  $('#sheetTitle').textContent = s.title;
  $('#sheetBody').innerHTML = s.bodyHTML;
  $('#sheetFoot').innerHTML = s.footHTML || '';

  $('#sheet').classList.add('open');

  // dismissed, however the dismissal happened — button, backdrop or Escape
  const dropped = all ? sheetStack.slice() : sheetStack.slice(-1);
  sheetStack = all ? [] : sheetStack.slice(0, -1);
  dropped.forEach(s => { if (s && s.onDismiss) s.onDismiss(); });
  if (sheetStack.length) { renderSheet(); return; }
  $('#sheet').classList.remove('open');
  $('#sheetBg').classList.remove('open');
  setTimeout(() => { if (!sheetStack.length) { $('#sheetBody').innerHTML = ''; $('#sheetFoot').innerHTML = ''; } }, 260);
}
/* Pop sheets stacked ON TOP of the meal-preview sheet without dismissing the
   preview itself — used after staging an item, so the plan survives. */
function closeToPreview() {
  while (sheetStack.length && !sheetStack[sheetStack.length - 1].isPreview) sheetStack.pop();
}
function replaceSheet(title, bodyHTML, footHTML, onMount) {
  sheetStack.pop();
  openSheet(title, bodyHTML, footHTML, onMount);
}

/* ---------- progress helpers ---------- */
/* Macros are not all the same kind of number, and showing them identically is
   misleading:
     budget  — calories. Going over is the thing that actually matters.
     floor   — protein, fiber. These are minimums; exceeding them is a good
               outcome, not a failure, and must never be flagged red.
     flex    — carbs, fat. Allocations within the energy budget. Being a few
               grams over is not meaningful on its own if calories are fine. */
const MACRO_META = {
  calories: { label: 'Calories', unit: 'kcal', color: 'var(--cal)', verb: 'remaining', kind: 'budget' },
  protein: { label: 'Protein', unit: 'g', color: 'var(--pro)', verb: 'still needed', kind: 'floor' },
  carbs: { label: 'Carbs', unit: 'g', color: 'var(--carb)', verb: 'remaining', kind: 'flex' },
  fat: { label: 'Fat', unit: 'g', color: 'var(--fat)', verb: 'remaining', kind: 'flex' },
  fiber: { label: 'Fiber', unit: 'g', color: 'var(--fib)', verb: 'still needed', kind: 'floor' }
};
function ringSVG(pct, size, stroke, color, over) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const p = clamp(pct, 0, 1), dash = c * p;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${over ? 'var(--over)' : color}"
      stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${dash} ${c}"
      style="transition:stroke-dasharray .5s cubic-bezier(.22,1,.36,1)"/>
  </svg>`;
}
function barRow(key, got, goal, ctx) {
  const m = MACRO_META[key];
  const pct = goal > 0 ? got / goal : 0;
  const past = got > goal + 0.5;
  const left = goal - got;
  let cls = '', txt, barCol = m.color, striped = false;

  if (m.kind === 'floor') {
    // a minimum: reaching or passing it is the win
    if (past) { cls = 'good'; txt = `Target met — ${fmtG(Math.abs(left))} ${m.unit} above`; }
    else if (goal > 0 && pct >= 0.95) { cls = 'good'; txt = `Target met`; }
    else txt = `${fmtG(Math.max(left, 0))} ${m.unit} ${m.verb}`;
  } else if (m.kind === 'budget') {
    // calories: the number that actually governs fat loss
    if (past) { cls = 'over'; barCol = 'var(--over)'; striped = true; txt = `${fmtG(Math.abs(left))} ${m.unit} over budget`; }
    else if (goal > 0 && pct >= 0.95) { cls = 'good'; txt = `On target — ${fmtG(Math.max(left, 0))} ${m.unit} ${m.verb}`; }
    else txt = `${fmtG(Math.max(left, 0))} ${m.unit} ${m.verb}`;
  } else {
    // carbs / fat: flexible allocation, judged against calories rather than alone
    if (past) {
      const calOk = ctx && ctx.calOk;
      cls = calOk ? '' : 'warn';
      barCol = 'var(--warn)';
      txt = calOk
        ? `${fmtG(Math.abs(left))} ${m.unit} above allocation — fine, calories are on track`
        : `${fmtG(Math.abs(left))} ${m.unit} above allocation`;
    } else txt = `${fmtG(Math.max(left, 0))} ${m.unit} ${m.verb}`;
  }
  return `<div class="bar-row">
    <div class="bar-top"><span class="bar-name">${m.label}</span>
      <span class="bar-val">${fmtG(got)} / ${fmtG(goal)} ${m.unit}</span></div>
    <div class="bar"><i class="${striped ? 'over' : ''}" style="width:${clamp(pct, 0, 1) * 100}%;background:${barCol}"></i></div>
    <div class="remain ${cls}">${txt}</div>
  </div>`;
}

};
const lbToKg = lb => lb * 0.453592, kgToLb = kg => kg / 0.453592;
const ftInToCm = (ft, i) => (ft * 12 + i) * 2.54;

function renderSetup() {
  document.body.classList.add('no-nav');
  const u = setupData.units, met = u === 'metric';
  APP.innerHTML = `
  <div class="wrap" style="padding-top:calc(26px + var(--safe-t));padding-bottom:40px;max-width:560px">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:40px;line-height:1">🥗</div>
      <h1 style="margin-top:8px">Set up your targets</h1>
      <p style="color:var(--text-2);font-size:14.5px;margin-top:6px">
        A few details and the app works out calorie and macro targets for gradual fat loss
        while keeping protein high. Everything here is editable later.</p>
    </div>

    <div class="card">
      <div class="field"><span class="lbl">Units</span>
        <div class="seg" id="unitSeg">
          <button data-u="metric" class="${met ? 'on' : ''}">Metric (kg / cm)</button>
          <button data-u="imperial" class="${!met ? 'on' : ''}">Imperial (lb / ft)</button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label for="sAge">Age</label>
          <input type="number" id="sAge" inputmode="numeric" min="14" max="100" placeholder="e.g. 32" value="${esc(setupData.age)}"></div>
        <div class="field"><span class="lbl">Sex</span>
          <div class="seg" id="sexSeg">
            <button data-s="male" class="${setupData.sex === 'male' ? 'on' : ''}">Male</button>
            <button data-s="female" class="${setupData.sex === 'female' ? 'on' : ''}">Female</button>
          </div>
        </div>
      </div>
      <div class="hint" style="margin:-6px 0 12px">Sex is used only because the BMR formula needs it.</div>

      <div class="field"><label>Height</label>
        ${met
      ? `<input type="number" id="sHcm" inputmode="decimal" placeholder="cm, e.g. 175" value="${esc(setupData.heightCm)}">`
      : `<div class="grid2">
               <input type="number" id="sHft" inputmode="numeric" placeholder="feet" value="${esc(setupData.heightFt)}">
               <input type="number" id="sHin" inputmode="numeric" placeholder="inches" value="${esc(setupData.heightIn)}"></div>`}
      </div>
      <div class="grid2">
        <div class="field"><label>Current weight</label>
          <input type="number" id="sW" inputmode="decimal" placeholder="${met ? 'kg' : 'lb'}" value="${esc(met ? setupData.weightKg : setupData.weightLb)}"></div>
        <div class="field"><label>Goal weight <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>
          <input type="number" id="sGW" inputmode="decimal" placeholder="${met ? 'kg' : 'lb'}" value="${esc(met ? setupData.goalWeightKg : setupData.goalWeightLb)}"></div>
      </div>
    </div>

    <div class="card">
      <div class="field"><span class="lbl">Activity level (outside workouts)</span>
        <div class="choices" id="actChoices">
          ${Object.entries(ACTIVITY).map(([k, a]) => `
            <button class="choice ${setupData.activity === k ? 'on' : ''}" data-a="${k}">
              <span class="dot"></span><span><b>${a.label}</b><span>${a.desc}</span></span></button>`).join('')}
        </div>
      </div>
      <div class="field"><label for="sEx">Workouts per week: <b id="exVal">${setupData.exerciseDays}</b></label>
        <input type="range" id="sEx" min="0" max="7" step="1" value="${setupData.exerciseDays}" style="width:100%;padding:0;background:none;border:none">
        <div class="hint">Training days nudge your maintenance estimate up slightly.</div>
      </div>
    </div>

    <div class="card">
      <div class="field"><span class="lbl">Rate of fat loss</span>
        <div class="choices" id="rateChoices">
          ${RATES.map(r => `
            <button class="choice ${setupData.rate === r.v ? 'on' : ''}" data-r="${r.v}">
              <span class="dot"></span><span><b>${r.label}</b><span>${r.desc}</span></span></button>`).join('')}
        </div>
        <div class="hint">A gradual deficit protects muscle and is far easier to stick to. The app caps the
          deficit at 25% below maintenance regardless of what you pick.</div>
      </div>
      <div class="field"><label for="sMan">Manual calorie target <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>
        <input type="number" id="sMan" inputmode="numeric" placeholder="Leave blank to use the calculated target" value="${esc(setupData.manualCalories)}">
      </div>
    </div>

    <div id="preview"></div>

    <button class="btn primary wide" id="sDone" style="margin-top:4px;min-height:52px;font-size:16px">Start tracking</button>
    <div class="hint" style="text-align:center;margin-top:10px">
      All values are estimates from a standard formula (Mifflin-St Jeor). Bodies vary — treat them as a
      starting point and adjust after a couple of weeks of real data.</div>
    <div class="spacer"></div>
  </div>`;

  const seg = (id, attr, key, after) => $$(`#${id} button`).forEach(b => b.onclick = () => {
    setupData[key] = b.dataset[attr]; if (after) after(); else renderSetup();
  });
  seg('unitSeg', 'u', 'units');
  seg('sexSeg', 's', 'sex');
  $$('#actChoices .choice').forEach(b => b.onclick = () => { readSetup(); setupData.activity = b.dataset.a; renderSetup(); });
  $$('#rateChoices .choice').forEach(b => b.onclick = () => { readSetup(); setupData.rate = parseFloat(b.dataset.r); renderSetup(); });
  $('#sEx').oninput = e => { setupData.exerciseDays = num(e.target.value, 3); $('#exVal').textContent = e.target.value; updatePreview(); };
  ['sAge', 'sHcm', 'sHft', 'sHin', 'sW', 'sGW', 'sMan'].forEach(id => {
    const el = $('#' + id); if (el) el.oninput = () => { readSetup(); updatePreview(); };
  });
  $('#sDone').onclick = finishSetup;
  updatePreview();

  function readSetup() {
    setupData.age = $('#sAge').value;
    setupData.manualCalories = $('#sMan').value;
    if (setupData.units === 'metric') {
      setupData.heightCm = $('#sHcm') ? $('#sHcm').value : setupData.heightCm;
      setupData.weightKg = $('#sW').value;
      setupData.goalWeightKg = $('#sGW').value;
      setupData.weightLb = setupData.weightKg ? r1(kgToLb(num(setupData.weightKg))) : '';
      setupData.goalWeightLb = setupData.goalWeightKg ? r1(kgToLb(num(setupData.goalWeightKg))) : '';
    } else {
      setupData.heightFt = $('#sHft') ? $('#sHft').value : '';
      setupData.heightIn = $('#sHin') ? $('#sHin').value : '';
      if (setupData.heightFt || setupData.heightIn)
        setupData.heightCm = r1(ftInToCm(num(setupData.heightFt), num(setupData.heightIn)));
      setupData.weightLb = $('#sW').value;
      setupData.goalWeightLb = $('#sGW').value;
      setupData.weightKg = setupData.weightLb ? r1(lbToKg(num(setupData.weightLb))) : '';
      setupData.goalWeightKg = setupData.goalWeightLb ? r1(lbToKg(num(setupData.goalWeightLb))) : '';
    }
  }
  function profileFromSetup() {
    return {
      age: num(setupData.age), sex: setupData.sex, heightCm: num(setupData.heightCm),
      weightKg: num(setupData.weightKg), goalWeightKg: num(setupData.goalWeightKg) || null,
      activity: setupData.activity, exerciseDays: num(setupData.exerciseDays, 3),
      rate: num(setupData.rate, 0.45), manualCalories: num(setupData.manualCalories) || null,
      units: setupData.units, createdAt: Date.now()
    };
  }
  function setupProblem(p) {
    if (!(p.age >= 14 && p.age <= 100)) return 'Enter an age between 14 and 100.';
    if (!(p.heightCm >= 120 && p.heightCm <= 230)) return 'Enter a height between 120 and 230 cm (about 4′0″ to 7′6″).';
    if (!(p.weightKg >= 30 && p.weightKg <= 350)) return 'Enter a current weight between 30 and 350 kg (66–770 lb).';
    if (p.goalWeightKg && p.goalWeightKg < 30) return 'That goal weight looks like a typo — check the units.';
    if (p.goalWeightKg && p.goalWeightKg > p.weightKg * 1.5) return 'That goal weight is far above your current weight — check the units.';
    return null;
  }
  function setupValid(p) { return !setupProblem(p); }
  function updatePreview() {
    const p = profileFromSetup();
    const box = $('#preview');
    const problem = setupProblem(p);
    if (problem) {
      const blank = !setupData.age && !setupData.heightCm && !setupData.weightKg;
      box.innerHTML = `<div class="card" style="text-align:center;color:var(--text-3);font-size:14px">
        ${blank ? 'Fill in age, height and current weight to see your estimated targets.' : esc(problem)}</div>`;
      $('#sDone').disabled = true; return;
    }
    const t = computeTargets(p);
    // a manual target below the calculated floor is allowed, but only deliberately
    const needsAck = t.manualBelowFloor;
    $('#sDone').disabled = needsAck && !($('#lowAck') && $('#lowAck').checked);
    const gw = num(setupData.goalWeightKg);
    const goalBmi = gw && p.heightCm ? gw / Math.pow(p.heightCm / 100, 2) : 0;
    box.innerHTML = `
    ${needsAck ? `<div class="card" style="border-color:var(--${t.manualClamped ? 'over' : 'warn'})">
      <div class="card-h"><h3 style="color:var(--${t.manualClamped ? 'over' : 'warn'})">
        ${t.manualClamped ? `${fmt(HARD_MIN_KCAL)} kcal is the lowest this app will set` : `That's below your calculated floor`}</h3></div>
      <p style="font-size:13.5px;color:var(--text-2);margin:0 0 10px">
        ${t.manualClamped
        ? `You entered ${fmt(num(setupData.manualCalories))} kcal. This app doesn't set targets below
           ${fmt(HARD_MIN_KCAL)} kcal — not as a judgement about what's safe for you, which it has no way to
           determine, but because below that it can't build a coherent set of macros and the number is more often
           a typo than an intention. It will use <b>${fmt(HARD_MIN_KCAL)} kcal</b> instead, still well under the
           ${fmt(t.floor)} kcal your own details imply. If a very low intake is something you're pursuing
           deliberately, that's worth planning with a doctor or dietitian rather than an app.`
        : `You've set ${fmt(num(setupData.manualCalories))} kcal. Based on your details the app would not go below
           <b>${fmt(t.floor)} kcal</b> — roughly 1.1× your estimated BMR. Eating well under that for long tends to
           cost muscle and make the deficit hard to sustain, which works against what you're training for.`}</p>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer">
        <input type="checkbox" id="lowAck" style="width:auto;margin-top:3px" ${$('#lowAck') && $('#lowAck').checked ? 'checked' : ''}>
        <span>I understand and want to use ${fmt(t.calories)} kcal anyway</span></label></div>` : ''}
    <div class="card">
      <div class="card-h"><h3>Your estimated targets</h3><span class="badge est">Estimate</span></div>
      <div class="kv"><span class="k">BMR (at rest)</span><span class="v">${fmt(t.bmr)} kcal</span></div>
      <div class="kv"><span class="k">Maintenance (TDEE)</span><span class="v">${fmt(t.tdee)} kcal</span></div>
      <div class="kv"><span class="k">Daily calorie target</span><span class="v" style="color:var(--cal)">${fmt(t.calories)} kcal</span></div>
      <div class="kv"><span class="k">Daily deficit</span><span class="v">${fmt(t.deficit)} kcal${t.deficit > 0 ? ` (~${r1(t.deficit * 7 / 7700)} kg/wk)` : ''}</span></div>
      <div class="kv"><span class="k">Protein</span><span class="v" style="color:var(--pro)">${t.protein} g</span></div>
      <div class="kv"><span class="k">Carbs</span><span class="v" style="color:var(--carb)">${t.carbs} g</span></div>
      <div class="kv"><span class="k">Fat</span><span class="v" style="color:var(--fat)">${t.fat} g</span></div>
      <div class="kv"><span class="k">Fiber</span><span class="v" style="color:var(--fib)">${t.fiber} g</span></div>
      <div class="note" style="margin-top:12px">These are estimates, not measurements. Protein is treated as a
        <b>minimum</b> rather than a leftover: 1.8 g per kg of ${t.proteinRefKg < p.weightKg
        ? `${t.proteinRefKg} kg` : 'your bodyweight'}, set first, with the remaining energy divided between fat and
        carbs afterwards.${t.proteinRefKg < p.weightKg ? ` Goal weight is used as the reference so excess fat mass
        doesn't inflate the number, but it's held at no less than 80% of your current weight so an ambitious goal
        can't quietly lower your protein floor.` : ''} Exceeding protein or fiber is a good outcome, not an overage.
        You can change every one of these in Settings.</div>
    </div>
    ${t.incoherent ? `<div class="card" style="border-color:var(--warn)">
      <div class="note" style="border-left-color:var(--warn)">
        <b>This calorie target is too low to carry your other targets.</b> At ${r1(t.proteinRefKg)} kg, a minimum
        of protein, essential fat and carbohydrate together need about <b>${fmt(t.minCoherentKcal)} kcal</b>. The app has
        scaled all three down so they still add up to ${fmt(t.calories)} kcal, but that means none of them is at a
        level worth aiming for. Raising the calorie target to ${fmt(t.minCoherentKcal)} or above is the fix.</div></div>`
      : t.proteinReduced ? `<div class="card"><div class="note" style="border-left-color:var(--warn)">
        Protein has been set to ${t.protein} g rather than the usual 1.8 g/kg (${r0(1.8 * t.proteinRefKg)} g),
        because at ${fmt(t.calories)} kcal there isn't room for that much protein alongside essential fat and a
        minimum of carbohydrate. A higher calorie target would let protein sit where it should.</div></div>` : ''}
    ${goalBmi && goalBmi < 18.5 ? `<div class="card"><div class="note" style="border-left-color:var(--warn)">
      For your height, a goal weight of ${r1(gw)} kg works out to a BMI of about ${r1(goalBmi)}, below the
      18.5–24.9 range generally treated as the healthy band. BMI is a crude measure and says nothing about
      your build, so take it as a flag to sanity-check the number rather than a verdict.</div></div>` : ''}`;
    const ack = $('#lowAck');
    if (ack) ack.onchange = () => { $('#sDone').disabled = !ack.checked; };
  }
  function finishSetup() {
    readSetup();
    const p = profileFromSetup();
    const problem = setupProblem(p);
    if (problem) { toast(problem); return; }
    const t0 = computeTargets(p);
    if (t0.manualBelowFloor && !($('#lowAck') && $('#lowAck').checked)) {
      toast('Confirm the low calorie target first, or clear it'); return;
    }
    DB.profile = p;
    DB.targets = t0;
    DB.settings.units = p.units;
    const k = todayKey();
    day(k).weight = p.weightKg;
    save(true);
    document.body.classList.remove('no-nav');
    VIEW = 'today'; CUR = todayKey();
    render();
    toast('Targets set — start logging');
  }
}

/* ============================================================
   APP CHROME
   ============================================================ */
function navHTML() {
  const items = [['today', 'Today'], ['history', 'History'], ['foods', 'Foods'], ['progress', 'Progress'], ['settings', 'Settings']];
  return `<nav class="nav">${items.map(([k, l]) =>
    `<button data-nav="${k}" class="${VIEW === k ? 'on' : ''}">${ICON[k]}<span>${l}</span></button>`).join('')}</nav>`;
}
function render() {
  if (!DB.profile || !DB.targets) { renderSetup(); return; }
  document.body.classList.remove('no-nav');
  const body =
    VIEW === 'today' ? viewToday() :
      VIEW === 'history' ? viewHistory() :
        VIEW === 'foods' ? viewFoods() :
          VIEW === 'progress' ? viewProgress() : viewSettings();
  APP.innerHTML = navHTML() + body;
  $$('.nav button').forEach(b => b.onclick = () => {
    PREVIEW = null;                 // leaving Today abandons an unsaved plan
    VIEW = b.dataset.nav; window.scrollTo(0, 0); render();
  });
  if (VIEW === 'today') mountToday();
  if (VIEW === 'history') mountHistory();
  if (VIEW === 'foods') mountFoods();
  if (VIEW === 'progress') mountProgress();
  if (VIEW === 'settings') mountSettings();
}

/* ============================================================
   TODAY
   ============================================================ */
function viewToday() {
  const t = targetsFor(CUR), got = dayTotals(CUR), rem = remaining(CUR);
  const pct = t.calories > 0 ? got.calories / t.calories : 0;
  const over = got.calories > t.calories;
  const ctx = { calOk: got.calories <= t.calories };
  const isToday = CUR === todayKey();
  const d = dayOrNull(CUR);
  const nEntries = d ? d.entries.length : 0;

  return `
  <div class="apphead"><div class="wrap">
    <div>
      <div class="eyebrow">${isToday ? parseKey(CUR).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) : 'Viewing'}</div>
      <h1 style="margin-top:1px">${prettyDate(CUR)}</h1>
    </div>
    <div class="date-nav">
      <button class="btn icon" data-day="-1" aria-label="Previous day">${ICON.left}</button>
      ${!isToday ? `<button class="btn sm" data-day="today">Today</button>` : ''}
      <button class="btn icon" data-day="1" aria-label="Next day" ${CUR >= todayKey() ? 'disabled' : ''}>${ICON.right}</button>
    </div>
  </div></div>

  <div class="wrap">
    ${updateBannerHTML()}
    ${backupBannerHTML()}
    ${recalcNudgeHTML()}
    <div class="card">
      <div class="rings">
        <div class="ring-main" style="position:relative;width:118px;height:118px">
          ${ringSVG(pct, 118, 11, 'var(--cal)', over)}
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
            <div class="kcal-num" style="${over ? 'color:var(--over)' : ''}">${fmt(got.calories)}</div>
            <div class="kcal-sub">of ${fmt(t.calories)} kcal</div>
          </div>
        </div>
        <div class="ring-side">
          <div>
            <div style="font-size:15px;font-weight:650;${over ? 'color:var(--over)' : ''}">
              ${over ? `${fmt(Math.abs(rem.calories))} kcal over` : `${fmt(rem.calories)} kcal left`}</div>
            <div style="font-size:12.5px;color:var(--text-2);margin-top:2px">
              ${over ? 'Not a problem on its own — what matters is the weekly average.'
      : nEntries === 0 ? 'Nothing logged yet today.' : `${nEntries} item${nEntries > 1 ? 's' : ''} logged`}</div>
          </div>
          ${barRow('protein', got.protein, t.protein, ctx)}
        </div>
      </div>
      <div class="macro-grid three">
        ${barRow('fiber', got.fiber, t.fiber, ctx)}
        ${barRow('carbs', got.carbs, t.carbs, ctx)}
        ${barRow('fat', got.fat, t.fat, ctx)}
      </div>
    </div>

    <div class="card tight" id="coachCard">${coachHTML(CUR)}</div>
    ${CUR !== todayKey() && dayOrNull(CUR) && dayOrNull(CUR).targets
      && dayOrNull(CUR).targets.calories !== DB.targets.calories ? `<div class="card tight">
      <div class="hint" style="margin:0">Showing ${esc(prettyDate(CUR))} against the targets that applied then
        (${fmt(t.calories)} kcal, ${t.protein} g protein). Your current target is ${fmt(DB.targets.calories)} kcal.</div>
    </div>` : ''}

    <div class="card">
      <div class="card-h"><h3>Meals</h3>
        <div class="btn-row">
          <button class="btn sm" data-act="copyday">Copy meal or day</button>
          ${nEntries ? `<button class="btn sm" data-act="saveday">Save as meal</button>` : ''}
        </div></div>
      ${MEALS.map(m => mealHTML(CUR, m)).join('')}
    </div>

    ${nEntries ? `<div class="card tight">
      <div class="btn-row"><button class="btn sm" data-act="resetday">Reset this day</button></div></div>` : ''}

    <div class="card">
      <div class="card-h"><h3>Weight</h3></div>
      <div style="display:flex;gap:9px;align-items:center">
        <input type="number" inputmode="decimal" id="wIn" placeholder="${DB.settings.units === 'metric' ? 'kg' : 'lb'}"
          value="${d && d.weight ? esc(dispWeight(d.weight)) : ''}" style="flex:1">
        <button class="btn" data-act="saveweight">Save</button>
      </div>
      <div class="hint">Optional. Day-to-day swings are mostly water and food volume — the trend line on
        Progress is the useful number.</div>
    </div>
    <div class="spacer"></div>
  </div>

  <button class="fab" data-act="add">${ICON.plus} Add food</button>`;
}

function mealHTML(k, meal) {
  const d = dayOrNull(k);
  const entries = d ? d.entries.filter(e => e.meal === meal) : [];
  const tot = mealTotals(k, meal);
  return `<div class="meal">
    <div class="meal-h">
      <div class="t"><h3 style="font-size:15px">${MEAL_LABEL[meal]}</h3>
        ${entries.length ? `<span class="kc">${fmt(tot.calories)} kcal · P ${fmtG(tot.protein)}g</span>` : ''}</div>
      <button class="btn sm ghost" data-addmeal="${meal}">+ Add</button>
    </div>
    <div class="items">
      ${entries.length ? entries.map(e => {
    const n = entryNutr(e);
    return `<button class="item" data-entry="${e.id}">
          <div class="info">
            <div class="nm">${esc(e.name)} ${e.estimate ? '<span class="badge est">Est</span>' : ''}${e.kind === 'recipe' ? '<span class="badge rec">Recipe</span>' : ''}</div>
            <div class="sub">${esc(describeServing(e))} · P ${fmtG(n.protein)} · C ${fmtG(n.carbs)} · F ${fmtG(n.fat)}${n.fiber ? ` · Fib ${fmtG(n.fiber)}` : ''}</div>
          </div>
          <div class="kc">${fmt(n.calories)}</div>
        </button>`;
  }).join('') : `<div class="empty">Nothing logged</div>`}
    </div>
  </div>`;
}

function dispWeight(kg) {
  return DB.settings.units === 'metric' ? r1(kg) : r1(kgToLb(kg));
}
function inputWeightToKg(v) {
  const n = num(v); if (!n) return null;
  return DB.settings.units === 'metric' ? n : lbToKg(n);
}

/* ---------- daily coach ---------- */
function coachHTML(k) {
  const t = targetsFor(k), got = dayTotals(k), rem = remaining(k);
  const d = dayOrNull(k);
  const n = d ? d.entries.length : 0;
  const lines = [];
  const hasEstimate = d && d.entries.some(e => e.estimate);

  if (n === 0) {
    lines.push(['🍽️', `Nothing logged yet. Your budget for the day is <b>${fmt(t.calories)} kcal</b> with <b>${t.protein} g protein</b>.`]);
  } else {
    lines.push(['🔥', `You're at <b>${fmt(got.calories)}</b> of ${fmt(t.calories)} calories — ${rem.calories >= 0
      ? `about <b>${fmt(rem.calories)} kcal remaining</b>.` : `<b>${fmt(Math.abs(rem.calories))} kcal over</b> today.`}`]);

    if (rem.protein > 0.5) lines.push(['💪', `You still need about <b>${fmtG(rem.protein)} g of protein</b> today (${fmtG(got.protein)} of ${t.protein} g).`]);
    else lines.push(['✅', `Protein target met — ${fmtG(got.protein)} g of ${t.protein} g.`]);

    // the classic squeeze: calories nearly gone, protein still low
    const calUsed = t.calories > 0 ? got.calories / t.calories : 0;
    const proUsed = t.protein > 0 ? got.protein / t.protein : 0;
    if (calUsed > 0.75 && proUsed < 0.7 && rem.calories > 0) {
      const dens = rem.protein > 0 ? rem.calories / rem.protein : 0;
      lines.push(['🎯', `Your calorie budget is nearly used while protein is still below target. What's left works out to
        roughly <b>${r0(dens)} kcal per gram of protein</b> — leaner, higher-protein foods (chicken breast, tilapia,
        Greek yogurt, egg whites, whey) fit that better than carb- or oil-heavy options.`]);
    }
    if (rem.calories < 0 && rem.protein <= 0) {
      lines.push(['📊', `Over on calories with protein covered. One day above target doesn't undo a week — the weekly
        average on Progress is the number worth watching.`]);
    }
    if (rem.fiber > 0 && got.calories > t.calories * 0.6) {
      lines.push(['🌿', `Fiber is at ${fmtG(got.fiber)} of ${t.fiber} g — ${fmtG(rem.fiber)} g still needed. Vegetables,
        beans and fruit are the cheapest way to close that gap.`]);
    }
    // carbs/fat are allocations: only worth mentioning when calories are also over
    if (rem.calories < 0 && (got.fat > t.fat * 1.15 || got.carbs > t.carbs * 1.15)) {
      const driver = (got.fat - t.fat) * 9 > (got.carbs - t.carbs) * 4 ? 'fat' : 'carbs';
      lines.push(['🫒', `Calories are over and ${driver} is the larger contributor. ${driver === 'fat'
        ? 'Cooking oil is usually the biggest single lever there.'
        : 'Starchy portions — rice, eba, bread — are usually the biggest lever there.'}`]);
    } else if (rem.calories >= 0 && (got.carbs > t.carbs || got.fat > t.fat)) {
      lines.push(['⚖️', `You're above your carb or fat allocation but still inside your calorie budget, which is the
        number that governs fat loss. Nothing to correct here — the split is flexible.`]);
    }
  }
  if (hasEstimate) lines.push(['ℹ️', `Some of today's items are estimates, so these numbers are approximate. Building those
    dishes in the Recipe Builder once makes every future log of them accurate.`]);

  return `<div class="card-h" style="margin-bottom:4px"><h3>Today's status</h3></div>
    ${lines.map(([ic, txt]) => `<div class="coach-line"><span class="ic">${ic}</span><span>${txt}</span></div>`).join('')}
    <div class="btn-row" style="margin-top:12px">
      <button class="btn sm primary" data-act="plan">🍽️ Plan a meal</button>
      ${n ? `<button class="btn sm" data-act="stilleat">What can I still eat?</button>` : ''}
    </div>`;
}

function guessMeal() {
  const h = new Date().getHours();
  if (h < 11) return 'breakfast';
  if (h < 16) return 'lunch';
  if (h < 21) return 'dinner';
  return 'snacks';
}

/* ---------- what can I still eat ---------- */
/* Score a candidate portion against ALL the remaining macros, not just
   calories. The weights encode the hierarchy the app works to:
   calories are the gate, protein is the thing to close, fiber is a bonus,
   and carbs/fat are soft penalties only for the part that overshoots. */
function fitScore(n, rem) {
  const proNeed = Math.max(rem.protein, 0);
  const fibNeed = Math.max(rem.fiber, 0);
  const fatLeft = Math.max(rem.fat, 0);
  const carbLeft = Math.max(rem.carbs, 0);

  const proGain = Math.min(n.protein, proNeed);        // protein that actually helps
  const proWaste = Math.max(0, n.protein - proNeed) * 0.15;
  const fibGain = Math.min(n.fiber || 0, fibNeed);
  const fatOver = Math.max(0, n.fat - fatLeft);        // only the overshoot is penalised
  const carbOver = Math.max(0, n.carbs - carbLeft);
  const calCost = n.calories / 100;

  return {
    score: proGain * 10 + proWaste + fibGain * 2 - fatOver * 4 - carbOver * 1.5 - calCost * 0.6
      + Math.min(DB.usage[n.__id] ? DB.usage[n.__id].n : 0, 6) * 0.8,
    proGain, fibGain, fatOver, carbOver
  };
}
function fitLabel(f) {
  const bits = [];
  if (f.proGain >= 1) bits.push(`+${fmtG(f.proGain)} g toward protein`);
  if (f.fibGain >= 1) bits.push(`+${fmtG(f.fibGain)} g fiber`);
  if (f.fatOver < 0.5 && f.carbOver < 0.5) bits.push('fits fat and carbs');
  else {
    if (f.fatOver >= 0.5) bits.push(`${fmtG(f.fatOver)} g past fat`);
    if (f.carbOver >= 0.5) bits.push(`${fmtG(f.carbOver)} g past carbs`);
  }
  return bits.join(' · ');
}

function openStillEat(k) {
  const rem = remaining(k), t = targetsFor(k);
  const overCal = rem.calories <= 0;
  // candidate foods that fit inside remaining calories at a sensible portion
  const cands = [];
  const consider = [...DB.foods, ...DB.recipes.map(recipeToFood)];
  consider.forEach(f => {
    // a saved personal portion is the truest "normal serving" for this person
    const mine = defaultUsablePortion(f);
    let qty, uname;
    if (mine && f.units.some(u => u.name === mine.unit)) { qty = mine.qty; uname = mine.unit; }
    else {
      const unit = f.units[0];
      const pick = f.units.find(u => /portion|serving|slice|cup|fillet|breast|egg|handful|scoop|medium|bowl|mug|plate/i.test(u.name));
      if (pick) { uname = pick.name; qty = 1; }
      else { uname = unit.name; qty = (unit.name === 'g' || unit.name === 'ml') ? 100 : 1; }
    }
    const e = makeEntry(f, qty, uname, 'snacks');
    const n = entryNutr(e);
    if (n.calories <= 5) return;
    if (n.calories > Math.max(rem.calories, 0)) return;
    n.__id = f.id;
    const fit = fitScore(n, rem);
    // drop anything whose overshoot outweighs what it contributes
    if (fit.score <= 0) return;
    cands.push({ f, e, n, fit, score: fit.score, usedMine: !!mine });
  });
  cands.sort((a, b) => b.score - a.score);
  const top = cands.slice(0, 8);

  const body = `
    <p style="color:var(--text-2);font-size:14.5px;margin-bottom:12px">
      ${overCal
      ? `You're already at or past your calorie target for ${prettyDate(k).toLowerCase()}. Anything more goes above it — which is fine occasionally, just worth doing deliberately.`
      : `Whatever you eat for the rest of ${prettyDate(k).toLowerCase()} should roughly fit inside this:`}
    </p>
    <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px">
      ${[['calories', 'kcal'], ['protein', 'g protein'], ['carbs', 'g carbs'], ['fat', 'g fat']].map(([m, lbl]) =>
        `<div class="stat"><div class="l">${MACRO_META[m].label}</div>
           <div class="n" style="color:${rem[m] < 0 ? 'var(--over)' : MACRO_META[m].color}">${rem[m] < 0 ? '−' : ''}${fmtG(Math.abs(rem[m]))}</div>
           <div class="s">${lbl} ${rem[m] < 0 ? 'over' : 'left'}</div></div>`).join('')}
    </div>
    ${rem.protein > 0 && rem.calories > 0 ? `<div class="note" style="margin-bottom:14px">
      To land on both numbers you'd want roughly <b>${r0(rem.calories / Math.max(rem.protein, 1))} kcal per gram of protein</b>
      from here. For reference: chicken breast is about 5, salmon about 9, white rice about 48, and oil is
      protein-free. That's a guide, not a rule.</div>` : ''}
    ${top.length ? `<h3 style="font-size:14px;margin-bottom:6px">From your foods, these fit what's left</h3>
      <div class="srch-res">${top.map((c, i) => `
        <button class="res" data-fit="${i}">
          <div class="info"><div class="nm">${esc(c.f.name)} ${c.f.estimate ? '<span class="badge est">Est</span>' : ''}${c.usedMine ? '<span class="badge mine">My portion</span>' : ''}</div>
            <div class="sub">${esc(describeServing(c.e))} · ${fmt(c.n.calories)} kcal</div>
            <div class="sub" style="color:${c.fit.fatOver + c.fit.carbOver > 0.5 ? 'var(--warn)' : 'var(--good)'}">${esc(fitLabel(c.fit))}</div></div>
          <span style="color:var(--accent);font-weight:700;font-size:20px">+</span>
        </button>`).join('')}</div>`
      : `<div class="empty">Nothing in your foods fits what's left at a normal portion without pushing a macro
           well past its allocation. Smaller portions of anything still work.</div>`}
    <div class="hint" style="margin-top:12px">Ranked by how much of your remaining protein gap a normal portion
      closes, minus what it pushes past your remaining fat and carbs. Where a food is marked Est its numbers are
      approximate, so this is a shortlist rather than precise optimisation.</div>`;

  openSheet('What can I still eat?', body, `<button class="btn" data-act="close">Close</button>`, () => {
    $('#sheetFoot [data-act=close]').onclick = () => closeSheet();
    $$('[data-fit]').forEach(b => b.onclick = () => {
      const c = top[parseInt(b.dataset.fit, 10)];
      closeSheet();
      openPortion(c.f, guessMeal(), null, c.e.qty, c.e.unit);
    });
  });
}

    }
    const mp = r.type === 'meal' ? null : defaultUsablePortion(foodOf(r));

          ${it.estimate ? '<span class="badge est">Est</span>' : ''}

const foodOf = r => r.type === 'recipe' ? recipeToFood(r.item) : r.item;
/* nutrition of a saved portion, for the search-row subtitle */
function quickPortionNutr(r, mp) {

}
/* single place that commits an entry, so quick-add and the portion sheet
   behave identically (including staging into Meal Preview) */
function commitEntry(entry, foodId) {
  if (PREVIEW) {
    PREVIEW.items.push(entry);
    bumpUsage(foodId);
    save(); closeToPreview(); drawPreview();
    toast('Added to the plan');
    return;
  }
  stampDay(CUR).entries.push(entry);
  bumpUsage(foodId);
  save(); closeSheet(true); render();
  toast(`Added to ${MEAL_LABEL[entry.meal]}`);
}

function savedMealNutr(m) {
  let t = zero();
  m.items.forEach(e => { const n = entryNutr(e); MACROS.forEach(k => t[k] += n[k]); });
  return t;
}
function addSavedMeal(m) {
  const target = PREVIEW ? PREVIEW.items : stampDay(CUR).entries;
  m.items.forEach(e => {
    const copy = {
      ...e, id: uid(), nutr: { ...e.nutr }, at: Date.now(),
      meal: PREVIEW ? PREVIEW.meal : (m.meal || e.meal || addCtx.meal)
    };
    target.push(copy);
    bumpUsage(copy.foodId);
  });
  DB.usage[m.id] = { n: (DB.usage[m.id]?.n || 0) + 1, last: Date.now() };
  save();
  if (PREVIEW) { closeToPreview(); drawPreview(); toast(`${m.name} added to the plan`); }
  else { closeSheet(true); render(); toast(`${m.name} added`); }
}
