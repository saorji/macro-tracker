    $$('#pRate .choice').forEach(b => b.onclick = () => { rate = parseFloat(b.dataset.r); $$('#pRate .choice').forEach(x => x.classList.toggle('on', x === b)); });
    $('#pEx').oninput = e => { $('#pExV').textContent = e.target.value; };
    $('#sheetFoot [data-act=cancel]').onclick = () => closeSheet();
    $('#sheetFoot [data-act=save]').onclick = () => {
      const wKg = inputWeightToKg($('#pW').value);
      const gKg = inputWeightToKg($('#pG').value);
      if (!wKg || wKg < 25) { toast('Enter a valid weight'); return; }
      DB.profile = {
        ...p, age: num($('#pAge').value, p.age), sex, heightCm: num($('#pH').value, p.heightCm),
        weightKg: wKg, goalWeightKg: gKg || null, activity: act,
        exerciseDays: num($('#pEx').value, p.exerciseDays), rate,
        manualCalories: num($('#pMan').value) || null
      };
      save(); closeSheet();
      confirmSheet('Recalculate targets?',
        'Your details changed. Recalculate calorie and macro targets from them? Choosing Keep leaves your current targets as they are.',
        'Recalculate', () => {
          DB.targets = computeTargets(DB.profile); refreshTodayTargets();
          save(); render(); toast('Targets updated');
        });
      const cancelBtn = $('#sheetFoot [data-act=cancel]');
      if (cancelBtn) cancelBtn.textContent = 'Keep current';
      render();
    };
  });
}

/* ---------- theme ---------- */
/* Theme is 'light' | 'dark' | 'system'. 'system' follows the OS setting
   live, which is what people expect from an app in 2026. */
function prefersDark() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function resolvedTheme() {
  const t = (DB.settings && DB.settings.theme) || 'system';
  if (t === 'system') return prefersDark() ? 'dark' : 'light';
  return t === 'dark' ? 'dark' : 'light';
}
function applyTheme() {
  const dark = resolvedTheme() === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const mt = document.querySelector('meta[name=theme-color]');
  if (mt) mt.setAttribute('content', dark ? '#000000' : '#ffffff');
  const sb = document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');
  if (sb) sb.setAttribute('content', dark ? 'black-translucent' : 'default');
}
let themeWatcherBound = false;
function watchSystemTheme() {
  if (themeWatcherBound || !window.matchMedia) return;
  themeWatcherBound = true;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => {
    if (((DB.settings && DB.settings.theme) || 'system') !== 'system') return;
    applyTheme();
    if (VIEW === 'progress') mountProgress();   // canvases read CSS variables
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

/* ---------- export / import ----------
   Getting a file OUT of a Home Screen web app on iOS is the fragile part.
   An <a download> on a blob URL is fine in a normal browser tab, but in
   standalone mode it has a history of opening a blank page or doing nothing,
   and it never reports failure. On touch devices the share sheet is the
   dependable route — it offers Save to Files, AirDrop, mail — and it tells
   us whether the person actually went through with it. Desktop keeps the
   plain download.                                                       */
function isStandalone() {
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function prefersShareSheet() {
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  return isStandalone() || touch;
}
function downloadViaAnchor(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
/* Resolves to 'shared' | 'downloaded' | 'cancelled'. Must be called straight
   from a tap handler — the share sheet requires a user gesture. */
async function saveFile(filename, text, mime) {
  const type = mime || 'application/json';
  const blob = new Blob([text], { type });
  if (prefersShareSheet() && navigator.share && navigator.canShare && typeof File === 'function') {
    let file = null;
    try { file = new File([blob], filename, { type }); } catch (e) { file = null; }
    if (file && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return 'shared';
      } catch (e) {
        // the person closed the sheet without picking anything: not an error,
        // but nothing was saved either — anything else falls through
        if (e && e.name === 'AbortError') return 'cancelled';
        console.warn('share failed, falling back to download', e);
      }
    }
  }
  downloadViaAnchor(filename, blob);
  return 'downloaded';
}
async function exportJSON() {
  if (!DB.meta) DB.meta = {};
  const now = Date.now();
  // the backup itself should record when it was taken, but the app only
  // believes a backup exists once the file has actually left
  const payload = {
    ...DB, meta: { ...DB.meta, lastExport: now, backupSnoozeUntil: null },
    exportedAt: new Date(now).toISOString(), app: 'macrotracker', version: 1
  };
  const result = await saveFile(`macro-tracker-backup-${todayKey()}.json`, JSON.stringify(payload, null, 2));
  if (result === 'cancelled') { toast('Backup not saved'); return false; }
  DB.meta.lastExport = now;
  DB.meta.backupSnoozeUntil = null;
  save(true);
  toast(result === 'shared' ? 'Backup saved' : 'Backup downloaded');
  return true;
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  const keys = Object.keys(DB.days).sort();
  if (!keys.length) { toast('Nothing to export yet'); return; }
  const rows = [['Date', 'Calories', 'Protein (g)', 'Carbs (g)', 'Fat (g)', 'Fiber (g)',
    'Calorie target', 'Protein target', 'Within target', 'Protein target met',
    'Target source', 'Weight (kg)', 'Items logged']];
  keys.forEach(k => {
    const d = DB.days[k];
    const has = d.entries && d.entries.length;
    const n = dayTotals(k);
    if (!has && !d.weight) return;
    // each row is scored against the target that applied on that date, so the
    // CSV agrees with History and Progress rather than with today's numbers
    const t = targetsFor(k);
    rows.push([k, r1(n.calories), r1(n.protein), r1(n.carbs), r1(n.fat), r1(n.fiber),
      t.calories, t.protein,
      has ? (n.calories <= t.calories ? 'yes' : 'no') : '',
      has ? (n.protein >= t.protein * 0.95 ? 'yes' : 'no') : '',
      has ? (usesFallbackTargets(k) ? 'current (day predates snapshots)' : 'that day') : '',
      d.weight ? r1(d.weight) : '', has ? d.entries.length : 0]);
  });
  saveFile(`macro-tracker-history-${todayKey()}.csv`,
    rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv')
    .then(r => toast(r === 'cancelled' ? 'CSV not saved' : r === 'shared' ? 'CSV saved' : 'CSV downloaded'));
}
function importJSON(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { toast('That file is not valid JSON'); return; }
  if (!parsed || typeof parsed !== 'object' || !parsed.days || typeof parsed.days !== 'object') {
    toast('That does not look like a Macro Tracker backup'); return;
  }
  const nDays = Object.keys(parsed.days).length;
  const nEnt = Object.values(parsed.days).reduce((a, d) => a + ((d && d.entries) ? d.entries.length : 0), 0);
  confirmSheet('Import this backup?',
    `It contains ${nDays} day${nDays === 1 ? '' : 's'} (${nEnt} entries), ${(parsed.recipes || []).length} recipes and ` +
    `${(parsed.foods || []).filter(f => f.custom).length} custom foods. This replaces everything currently in the app.`,
    'Import', () => {
      DB = Object.assign(defaultDB(), parsed);
      DB.settings = Object.assign({ theme: 'system', units: 'metric' }, parsed.settings || {});
      if (!DB.foods || !DB.foods.length) DB.foods = starterFoods();
      if (!Array.isArray(DB.recipes)) DB.recipes = [];
      if (!Array.isArray(DB.savedMeals)) DB.savedMeals = [];
      if (!DB.usage || typeof DB.usage !== 'object') DB.usage = {};
      save(true);
      CUR = todayKey(); HIST = todayKey(); CAL_MONTH = null; VIEW = 'today';
      applyTheme(); render();
      toast('Backup imported');
    });
}

/* ============================================================
   OFFLINE / SERVICE WORKER
   The Home Screen icon has to open with no signal — a gym or a restaurant is
   exactly where this app gets used and where the network is worst. The worker
   precaches the app; here we only register it and handle the update, which is
   deliberately never automatic: a reload in the middle of logging a meal
   would throw away whatever sheet was open.
   ============================================================ */
let updateReady = false;
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  // needs a secure context; opening index.html straight off disk has none
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          // controller present means this is an update, not the first install
          if (sw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(reg);
        });
      });
      // a worker that finished installing while the app was closed
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg);
    }).catch(err => console.warn('service worker registration failed', err));

    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  });
}
function offerUpdate(reg) {
  if (updateReady) return;
  updateReady = true;
  if (VIEW) render();            // surfaces the banner on Today
}
function updateBannerHTML() {
  if (!updateReady || CUR !== todayKey()) return '';
  return `<div class="card tight" id="updateBanner" style="border-color:var(--accent)">
    <div style="display:flex;gap:11px;align-items:flex-start">
      <span style="font-size:17px;line-height:1.3">⬆️</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650;font-size:14.5px">A new version is ready</div>
        <div style="font-size:13px;color:var(--text-2);margin-top:2px;line-height:1.45">
          It's already downloaded and will be used the next time the app starts. Reloading now takes a second and
          changes nothing you've logged.</div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn sm primary" data-act="swReload">Reload now</button>
          <button class="btn sm" data-act="swLater">Later</button>
        </div>
      </div>
    </div>
  </div>`;
}
function mountUpdateBanner() {
  const r = $('[data-act=swReload]');
  if (r) r.onclick = () => {
    save(true);                  // flush any debounced write before the reload
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg && reg.waiting) { reg.waiting.postMessage('SKIP_WAITING'); setTimeout(() => location.reload(), 900); }
      else location.reload();
    }).catch(() => location.reload());
  };
  const l = $('[data-act=swLater]');
  if (l) l.onclick = () => { updateReady = false; render(); toast('It will be applied next time you open the app'); };
}

/* ============================================================
   BOOT
   ============================================================ */
let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  load();
  applyTheme();
  watchSystemTheme();
  registerSW();
  CUR = todayKey(); HIST = todayKey();
  render();
  // if the app is left open past midnight, roll the view to the new day
  setInterval(() => {
    const t = todayKey();
    if (VIEW === 'today' && CUR !== t && CUR === window.__lastToday) { CUR = t; render(); }
    window.__lastToday = t;
  }, 60000);
  window.__lastToday = todayKey();
  let rz = null;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if (VIEW === 'progress') mountProgress(); }, 220);
  });
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
