function openPortion(food, meal, existingEntryId, presetQty, presetUnit) {
  const units = food.units && food.units.length ? food.units : [{ name: 'serving', factor: food.ref.amount }];
  let unit = presetUnit && units.some(u => u.name === presetUnit) ? presetUnit : units[0].name;
  let qty = presetQty != null ? presetQty : defaultQty(units.find(u => u.name === unit));
  let m = meal;

  const mine = portionsFor(food.id).filter(mp => units.some(u => u.name === mp.unit));
  // a saved personal portion is the most likely choice, so it wins the default
  if (presetQty == null && !presetUnit && mine.length) {
    const d = mine.find(x => x.fav) || mine[0];
    unit = d.unit; qty = d.qty;
  }
  const quick = units.slice(0, 6);
  const body = `
    <div id="portionCalc" class="card tight" style="margin-bottom:14px;box-shadow:none"></div>
    ${mine.length ? `<div class="field"><span class="lbl">My portions</span>
      <div class="portion-chips" id="pMine">${mine.map(mp =>
        `<button class="pchip mine" data-mp="${esc(mp.id)}">${mp.fav ? '★ ' : ''}${esc(mp.label)}
          <span style="opacity:.7;font-weight:500"> · ${esc(mp.qty)} ${esc(mp.unit)}</span></button>`).join('')}
      </div></div>` : ''}
    ${food.estimate ? `<div class="note" style="margin-bottom:14px;border-left-color:var(--warn)">
        <b>This is an estimate.</b>${food.range ? ` Typical range: ${esc(food.range)}.` : ''}
        ${food.note ? ' ' + esc(food.note) : ''}
        ${food.kind !== 'recipe' ? `<div style="margin-top:9px"><button class="btn sm" data-act="toRecipe">Build it from my ingredients instead</button></div>` : ''}
      </div>` : (food.note ? `<div class="note" style="margin-bottom:14px">${esc(food.note)}</div>` : '')}

    <div class="grid2">
      <div class="field"><label for="pQty">Quantity</label>
        <input type="number" id="pQty" inputmode="decimal" step="any" value="${qty}"></div>
      <div class="field"><label for="pUnit">Unit</label>
        <select id="pUnit">${units.map(u => `<option value="${esc(u.name)}" ${u.name === unit ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>
    </div>
    ${quick.length > 1 ? `<div class="field"><span class="lbl">Quick portions</span>
      <div class="portion-chips" id="pQuick">${quick.map(u =>
        `<button class="pchip" data-u="${esc(u.name)}">${esc(u.name === 'g' ? '100 g' : u.name === 'ml' ? '250 ml' : u.name)}</button>`).join('')}
      </div></div>` : ''}
    <div class="field"><span class="lbl">Meal</span>
      <div class="seg" id="pMeal">${MEALS.map(x =>
        `<button data-m="${x}" class="${m === x ? 'on' : ''}">${MEAL_LABEL[x]}</button>`).join('')}</div>
    </div>
    <div class="hint">Nutrition reference: ${food.ref.amount === 1 ? '' : fmtG(food.ref.amount) + ' '}${esc(food.ref.unit)}
      = ${fmt(food.nutr.calories)} kcal, ${fmtG(food.nutr.protein)} g protein, ${fmtG(food.nutr.carbs)} g carbs,
      ${fmtG(food.nutr.fat)} g fat${food.nutr.fiber ? `, ${fmtG(food.nutr.fiber)} g fiber` : ''}.
      ${food.lib ? ' Portion sizes in brackets are the gram amounts the app assumes — pick “g” and type your own if yours differ.' : ''}
      ${!food.lib && !food.kind ? '' : ''}</div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn sm" data-act="savePortion">Save this as my portion</button>
      ${mine.length ? `<button class="btn sm" data-act="managePortions">Manage my portions</button>` : ''}
      ${food.id && !food.kind ? `<button class="btn sm" data-act="editfood">Edit nutrition</button>` : ''}
    </div>`;

  const foot = `<button class="btn" data-act="cancel">Cancel</button>
                <button class="btn primary" data-act="add">${existingEntryId ? 'Save changes' : 'Add to ' + MEAL_LABEL[m]}</button>`;

  openSheet(food.name, body, foot, () => {
    const qEl = $('#pQty'), uEl = $('#pUnit');
    const recalc = () => {
      qty = num(qEl.value, 0); unit = uEl.value;
      const e = makeEntry(food, qty, unit, m);
      const n = entryNutr(e);
      $('#portionCalc').innerHTML = `
        <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
          <div style="font-size:31px;font-weight:750;letter-spacing:-.03em;color:var(--cal)">${fmt(n.calories)}</div>
          <div style="font-size:13.5px;color:var(--text-2)">kcal for ${esc(describeServing(e))}</div>
          ${food.estimate ? '<span class="badge est">Estimate</span>' : ''}
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:13.5px">
          <span><b style="color:var(--pro)">${fmtG(n.protein)} g</b> protein</span>
          <span><b style="color:var(--carb)">${fmtG(n.carbs)} g</b> carbs</span>
          <span><b style="color:var(--fat)">${fmtG(n.fat)} g</b> fat</span>
          <span><b style="color:var(--fib)">${fmtG(n.fiber)} g</b> fiber</span>
        </div>`;
      $$('#pQuick .pchip').forEach(c => c.classList.toggle('on', c.dataset.u === unit));
      const btn = $('#sheetFoot [data-act=add]');
      if (btn && !existingEntryId) btn.textContent = 'Add to ' + MEAL_LABEL[m];
    };
    qEl.oninput = recalc; uEl.onchange = () => {
      const u = units.find(x => x.name === uEl.value);
      qEl.value = defaultQty(u); recalc();
    };
    $$('#pQuick .pchip').forEach(c => c.onclick = () => {
      uEl.value = c.dataset.u;
      qEl.value = defaultQty(units.find(u => u.name === c.dataset.u));
      recalc();
    });
    $$('#pMine .pchip').forEach(c => c.onclick = () => {
      const mp = mine.find(x => x.id === c.dataset.mp);
      if (!mp) return;
      uEl.value = mp.unit; qEl.value = mp.qty; recalc();
    });
    const sp = $('[data-act=savePortion]');
    if (sp) sp.onclick = () => openSavePortion(food, num(qEl.value, 0), uEl.value, () => {
      closeSheet(); openPortion(food, m, existingEntryId, num(qEl.value, 0), uEl.value);
    });
    const mpg = $('[data-act=managePortions]');
    if (mpg) mpg.onclick = () => openManagePortions(food, () => {
      closeSheet(); openPortion(food, m, existingEntryId, num(qEl.value, 0), uEl.value);
    });
    $$('#pMeal button').forEach(b => b.onclick = () => {
      m = b.dataset.m; $$('#pMeal button').forEach(x => x.classList.toggle('on', x === b)); recalc();
    });
    const ed = $('[data-act=editfood]'); if (ed) ed.onclick = () => openCustomFood(m, '', false, food);
    const tr = $('[data-act=toRecipe]'); if (tr) tr.onclick = () => {
      PREVIEW = null; closeSheet(true); VIEW = 'foods'; render();
      openRecipeBuilder(null, food.name.replace(/\s*\(.*?\)\s*/g, '').trim());
    };
    $('#sheetFoot [data-act=cancel]').onclick = () => closeSheet();
    $('#sheetFoot [data-act=add]').onclick = () => {
      if (num(qEl.value, 0) <= 0) { toast('Enter a quantity above zero'); return; }
      const e = makeEntry(food, num(qEl.value, 0), uEl.value, m);
      if (existingEntryId) {
        const d = day(CUR);
        const i = d.entries.findIndex(x => x.id === existingEntryId);
        if (i >= 0) { e.id = existingEntryId; e.at = d.entries[i].at; d.entries[i] = e; }
        bumpUsage(food.id);
        save(); closeSheet(true); render(); toast('Updated');
        return;
      }
      commitEntry(e, food.id);
    };
    recalc();
  });
}
/* ---------- saving a personal portion ---------- */
function openSavePortion(food, qty, unit, after) {
  if (!(qty > 0)) { toast('Set a quantity first'); return; }
  const suggested = /usual/i.test(food.name) ? 'My portion' : 'My usual';
  const e = makeEntry(food, qty, unit, 'snacks');
  const n = entryNutr(e);
  const body = `
    <p style="font-size:14px;color:var(--text-2);margin-bottom:12px">
      Saves <b>${esc(describeServing(e))}</b> of ${esc(food.name)} — ${fmt(n.calories)} kcal,
      ${fmtG(n.protein)} g protein — as a one-tap portion. It'll show at the top of this screen and as a
      quick-add in search.</p>
    <div class="field"><label for="mpLabel">Call it</label>
      <input type="text" id="mpLabel" value="${esc(suggested)}" placeholder="e.g. My usual, Big bowl, Work lunch"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0">
      <div><div style="font-weight:600;font-size:14.5px">Make it the default</div>
        <div style="font-size:12.5px;color:var(--text-2)">Pre-selected whenever you log this food</div></div>
      <label class="switch"><input type="checkbox" id="mpFav" checked><span class="track"></span></label>
    </div>
    <div class="hint">Measuring your own portion two or three times and saving the average is the single biggest
      accuracy win available — it replaces a generic "medium serving" with your actual one.</div>`;
  openSheet('Save my portion', body, `<button class="btn" data-act="cancel">Cancel</button>
    <button class="btn primary" data-act="ok">Save portion</button>`, () => {
    $('#sheetFoot [data-act=cancel]').onclick = () => closeSheet();
    $('#sheetFoot [data-act=ok]').onclick = () => {
      const label = ($('#mpLabel').value || '').trim();
      if (!label) { toast('Give the portion a name'); return; }
      const p = addMyPortion(food.id, label, qty, unit);
      if ($('#mpFav').checked) portionsFor(food.id).forEach(x => x.fav = x.id === p.id);
      save(); toast('Portion saved');
      closeSheet();
      if (after) after();
    };
  });
}
function openManagePortions(food, after) {
  const list = portionsFor(food.id);
  const body = list.length ? `<div>${list.map(mp => {
    const n = entryNutr(makeEntry(food, mp.qty, mp.unit, 'snacks'));
    return `<div class="ing-row">
      <div class="info"><div style="font-weight:600;font-size:14.5px">${mp.fav ? '★ ' : ''}${esc(mp.label)}</div>
        <div style="font-size:12.5px;color:var(--text-2)">${esc(mp.qty)} ${esc(mp.unit)} · ${fmt(n.calories)} kcal</div></div>
      ${mp.fav ? '' : `<button class="btn sm" data-fav="${esc(mp.id)}">Default</button>`}
      <button class="btn sm danger" data-del="${esc(mp.id)}">✕</button></div>`;
  }).join('')}</div>` : `<div class="empty">No saved portions for this food yet.</div>`;
  openSheet(`My portions — ${food.name}`, body, `<button class="btn" data-act="close">Done</button>`, () => {
    $('#sheetFoot [data-act=close]').onclick = () => { closeSheet(); if (after) after(); };
    $$('[data-fav]').forEach(b => b.onclick = () => {
      portionsFor(food.id).forEach(x => x.fav = x.id === b.dataset.fav);
      save(); closeSheet(); openManagePortions(food, after);
    });
    $$('[data-del]').forEach(b => b.onclick = () => {
      removeMyPortion(food.id, b.dataset.del);
      save(); closeSheet();
      if (portionsFor(food.id).length) openManagePortions(food, after);
      else if (after) after();
      toast('Portion removed');
    });
  });
}

function defaultQty(u) {
  if (!u) return 1;
  if (u.name === 'g' || u.name.startsWith('g ')) return 100;
  if (u.name === 'ml') return 250;
  if (u.name === 'oz') return 4;
  return 1;
}

/* ============================================================
   CUSTOM FOOD / NUTRITION LABEL ENTRY
   ============================================================ */
function openCustomFood(meal, presetName, labelMode, editFood) {
  const f = editFood || null;
  const isEdit = !!f;
  const body = `
    ${!isEdit ? `<div class="seg" id="modeSeg" style="margin-bottom:14px">
      <button data-mode="label" class="${labelMode !== false ? 'on' : ''}">From a label</button>
      <button data-mode="per100" class="${labelMode === false ? 'on' : ''}">Per 100 g</button>
    </div>` : ''}
    <div class="field"><label for="cName">Food name</label>
      <input type="text" id="cName" placeholder="e.g. Mum's egusi, Chi Exotic juice" value="${esc(f ? f.name : (presetName || ''))}"></div>

    <div class="field"><label for="cServ" id="servLbl">Serving size as written on the pack</label>
      <div class="grid2">
        <input type="number" id="cServ" inputmode="decimal" step="any" placeholder="e.g. 30"
          value="${f ? f.ref.amount : 100}">
        <input type="text" id="cServU" placeholder="unit, e.g. g / ml / slice" value="${esc(f ? f.ref.unit : 'g')}">
      </div>
      <div class="hint" id="servHint">Enter the numbers exactly as the label states them for one serving. The app
        scales from there.</div>
    </div>

    <div class="grid2">
      <div class="field"><label for="cKcal">Calories (kcal)</label>
        <input type="number" id="cKcal" inputmode="decimal" step="any" value="${f ? f.nutr.calories : ''}"></div>
      <div class="field"><label for="cPro">Protein (g)</label>
        <input type="number" id="cPro" inputmode="decimal" step="any" value="${f ? f.nutr.protein : ''}"></div>
      <div class="field"><label for="cCarb">Carbs (g)</label>
        <input type="number" id="cCarb" inputmode="decimal" step="any" value="${f ? f.nutr.carbs : ''}"></div>
      <div class="field"><label for="cFat">Fat (g)</label>
        <input type="number" id="cFat" inputmode="decimal" step="any" value="${f ? f.nutr.fat : ''}"></div>
      <div class="field"><label for="cFib">Fiber (g)</label>
        <input type="number" id="cFib" inputmode="decimal" step="any" value="${f ? f.nutr.fiber : ''}"></div>
      <div class="field"><label for="cEst">Mark as estimate</label>
        <div style="display:flex;align-items:center;gap:10px;min-height:44px">
          <label class="switch"><input type="checkbox" id="cEst" ${f && f.estimate ? 'checked' : ''}><span class="track"></span></label>
          <span style="font-size:13px;color:var(--text-2)">If you're guessing</span>
        </div></div>
    </div>

    <div class="field"><label for="cUnits">Extra portion options <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>
      <input type="text" id="cUnits" placeholder="e.g. slice=30, medium portion=150"
        value="${f ? esc((f.units || []).filter(u => u.name !== f.ref.unit && !/^(g|ml|oz)$/.test(u.name)).map(u => `${u.name}=${r1(u.factor)}`).join(', ')) : ''}">
      <div class="hint">Named portions and how many <b id="refUnitName">${esc(f ? f.ref.unit : 'g')}</b> each one is.
        Comma separated. These show up as quick-tap buttons when logging.</div>
    </div>

    <div id="cPreview" class="note" style="display:none"></div>
    ${isEdit ? `<div class="btn-row" style="margin-top:14px">
      <button class="btn sm danger" data-act="delfood">Delete food</button></div>` : ''}`;

  const foot = `<button class="btn" data-act="cancel">Cancel</button>
    <button class="btn primary" data-act="save">${isEdit ? 'Save food' : 'Save & add'}</button>`;

  openSheet(isEdit ? 'Edit food' : 'New food', body, foot, () => {
    let mode = labelMode !== false ? 'label' : 'per100';
    const applyMode = () => {
      if (isEdit) return;
      $('#servLbl').textContent = mode === 'label' ? 'Serving size as written on the pack' : 'Reference amount';
      $('#servHint').textContent = mode === 'label'
        ? 'Enter the numbers exactly as the label states them for one serving. The app scales from there.'
        : 'Nutrition per 100 g is the most reusable way to store a food — then any weight works.';
      if (mode === 'per100') { $('#cServ').value = 100; $('#cServU').value = 'g'; }
      $('#refUnitName').textContent = $('#cServU').value || 'g';
    };
    $$('#modeSeg button').forEach(b => b.onclick = () => {
      mode = b.dataset.mode;
      $$('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
      applyMode(); preview();
    });
    const ids = ['cName', 'cServ', 'cServU', 'cKcal', 'cPro', 'cCarb', 'cFat', 'cFib', 'cUnits'];
    ids.forEach(i => { $('#' + i).oninput = preview; });
    $('#cServU').oninput = () => { $('#refUnitName').textContent = $('#cServU').value || 'g'; preview(); };
    applyMode(); preview();

    function build() {
      const refAmt = num($('#cServ').value, 100) || 100;
      const refU = ($('#cServU').value || 'g').trim();
      const extra = ($('#cUnits').value || '').split(',').map(s => s.trim()).filter(Boolean).map(s => {
        const [n, v] = s.split('=');
        return n && v != null ? { name: n.trim(), factor: num(v, 1) } : null;
      }).filter(Boolean);
      const units = [];
      if (/^(g|ml)$/i.test(refU)) {
        units.push({ name: refU.toLowerCase(), factor: 1 });
        if (refU.toLowerCase() === 'g') units.push({ name: 'oz', factor: G.oz });
      } else {
        units.push({ name: refU, factor: 1 });
      }
      extra.forEach(u => { if (!units.some(x => x.name === u.name)) units.push(u); });
      return {
        id: f ? f.id : 'usr_' + uid(),
        name: ($('#cName').value || '').trim() || 'Unnamed food',
        ref: { amount: refAmt, unit: refU },
        nutr: {
          calories: num($('#cKcal').value), protein: num($('#cPro').value), carbs: num($('#cCarb').value),
          fat: num($('#cFat').value), fiber: num($('#cFib').value)
        },
        units, estimate: $('#cEst').checked, custom: true, favorite: f ? f.favorite : false,
        lib: f ? f.lib : false, note: f ? f.note : undefined, range: f ? f.range : undefined,
        tags: f ? f.tags : []
      };
    }
    function preview() {
      const o = build(), box = $('#cPreview');
      const kcalFromMacros = o.nutr.protein * 4 + o.nutr.carbs * 4 + o.nutr.fat * 9;
      if (!o.nutr.calories && !kcalFromMacros) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      const diff = o.nutr.calories ? kcalFromMacros - o.nutr.calories : 0;
      const off = o.nutr.calories && Math.abs(diff) > Math.max(35, o.nutr.calories * 0.18);
      box.innerHTML = `Stored as <b>${fmt(o.nutr.calories)} kcal</b> per ${o.ref.amount === 1 ? '' : fmtG(o.ref.amount) + ' '}${esc(o.ref.unit)}.
        ${off ? `<br><span style="color:var(--warn)"><b>Check the numbers:</b> the protein, carbs and fat add up to about
          ${fmt(kcalFromMacros)} kcal, which is ${fmt(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'} than the calories you entered.
          Labels round, but a gap this size usually means a typo.</span>` : ''}`;
    }
    const del = $('[data-act=delfood]');
    if (del) del.onclick = () => confirmSheet('Delete this food?',
      `“${f.name}” will be removed from your foods. Anything you've already logged, and any recipe or saved meal ` +
      `that uses it, keeps its numbers.${f.lib ? ' It is a starter food, so “Restore starter foods” in Settings can bring it back.' : ''}`,
      'Delete', () => {
        deleteFood(f.id);
        save();
        // the editor may be stacked on this food's portion sheet, which is now
        // meaningless — drop everything above the meal plan, or everything
        if (PREVIEW) { closeToPreview(); drawPreview(); }
        else { closeSheet(true); if (VIEW === 'foods') render(); }
        toast('Food deleted');
      }, true);
    $('#sheetFoot [data-act=cancel]').onclick = () => closeSheet();
    $('#sheetFoot [data-act=save]').onclick = () => {
      const o = build();
      if (!$('#cName').value.trim()) { toast('Give the food a name'); return; }
      if (!o.nutr.calories && !o.nutr.protein && !o.nutr.carbs && !o.nutr.fat) { toast('Enter at least the calories'); return; }
      const i = DB.foods.findIndex(x => x.id === o.id);
      if (i >= 0) DB.foods[i] = o; else DB.foods.push(o);
      save();
      if (isEdit) { closeSheet(); toast('Food saved'); if (VIEW === 'foods') render(); }
      else { closeSheet(); openPortion(o, meal || guessMeal()); }
    };
  });
}

      save(); closeSheet(); render(); toast('Updated');

}
/* reconstruct a food-like object from a logged entry so the portion
   picker works even if the original food was deleted afterwards */
function foodForEntry(e) {
  const live = DB.foods.find(f => f.id === e.foodId);
  if (live) return live;
  const rec = DB.recipes.find(r => r.id === e.foodId);
  if (rec) return recipeToFood(rec);
  return {
    id: e.foodId, name: e.name, ref: { amount: e.refAmount, unit: e.refUnit },
    nutr: { ...e.nutr }, estimate: e.estimate, kind: e.kind,
    units: [{ name: e.unit, factor: e.factor }, ...(e.refUnit === 'g' ? [{ name: 'g', factor: 1 }] : [])]
  };
}

/* ============================================================

          <span>${byMeal[m].length} item${byMeal[m].length > 1 ? 's' : ''} · ${fmt(mealTotals(k, m).calories)} kcal</span></span></button>`).join('')}
        <button class="choice on" data-pick="all"><span class="dot"></span><span><b>The whole day</b>
          <span>${d.entries.length} items · ${fmt(dayTotals(k).calories)} kcal</span></span></button>

    <button class="btn primary" data-act="save">Save meal</button>`, () => {

    $$('#smPick .choice').forEach(b => b.onclick = () => {
      pick = b.dataset.pick;
      $$('#smPick .choice').forEach(x => x.classList.toggle('on', x === b));
    });

    $('#sheetFoot [data-act=save]').onclick = () => {

      if (!name) { toast('Give it a name'); return; }

      DB.savedMeals.push({
        id: 'meal_' + uid(), name, items, meal: pick === 'all' ? null : pick,

      });
      save(); closeSheet(); render(); toast('Meal saved');
    };
  });
}

/* ---------- copy a meal, or a whole day, from another date ----------
   Eating the same lunch as Tuesday is the common case, and it used to mean
   copying all four meals and deleting three of them. So the source is a meal
   by default; the whole day is one of the choices rather than the only one.
   A single meal can also land in a different meal slot — last night's dinner
   becomes today's lunch — which is how leftovers actually work. */
function openCopyDay(target) {
  let src = 'all';                 // 'all' | a meal name
  let dest = null;                 // meal to copy into; null = keep original meals

  const daysWith = pick => Object.keys(DB.days)
    .filter(k => k !== target && DB.days[k].entries && DB.days[k].entries.length)
    .filter(k => pick === 'all' || DB.days[k].entries.some(e => e.meal === pick))
    .sort().reverse().slice(0, 30);

  if (!daysWith('all').length) { toast('No other days with food logged yet'); return; }

  const body = `
    <div class="field" style="margin-bottom:12px"><span class="lbl">What to copy</span>
      <!-- chips rather than a segmented control: five options don't fit a
           single row on a 320px screen, and chips wrap where a seg squeezes -->
      <div class="chips" id="cdSrc" style="margin-bottom:0">
        <button class="chip on" data-s="all">Whole day</button>
        ${MEALS.map(m => `<button class="chip" data-s="${m}">${MEAL_LABEL[m]}</button>`).join('')}
      </div>
    </div>
    <div id="cdDest"></div>
    <p style="color:var(--text-2);font-size:14px;margin-bottom:10px" id="cdIntro"></p>
    <div id="cdList"></div>`;

  openSheet('Copy a meal or day', body, `<button class="btn" data-act="close">Close</button>`, () => {
    $('#sheetFoot [data-act=close]').onclick = () => closeSheet();

    const items = k => src === 'all' ? DB.days[k].entries : DB.days[k].entries.filter(e => e.meal === src);

    const drawDest = () => {
      const box = $('#cdDest');
      if (src === 'all') { box.innerHTML = ''; return; }
      box.innerHTML = `<div class="field" style="margin-bottom:12px"><span class="lbl">Add to</span>
        <div class="seg" id="cdDestSeg">${MEALS.map(m =>
        `<button data-d="${m}" class="${(dest || src) === m ? 'on' : ''}">${MEAL_LABEL[m]}</button>`).join('')}</div></div>`;
      $$('#cdDestSeg button').forEach(b => b.onclick = () => {
        dest = b.dataset.d;
        $$('#cdDestSeg button').forEach(x => x.classList.toggle('on', x === b));
        drawList();
      });
    };

    const drawList = () => {
      const keys = daysWith(src);
      const into = src === 'all' ? null : (dest || src);
      $('#cdIntro').innerHTML = src === 'all'
        ? `Copies every meal from the day you pick into ${esc(prettyDate(target).toLowerCase())}, keeping each item in
           its own meal. Anything already logged stays — this adds on top.`
        : `Copies that day's ${MEAL_LABEL[src].toLowerCase()} into <b>${MEAL_LABEL[into].toLowerCase()}</b> on
           ${esc(prettyDate(target).toLowerCase())}. Anything already logged stays.`;
      if (!keys.length) {
        $('#cdList').innerHTML = `<div class="empty" style="padding:18px 4px">
          No other day has ${MEAL_LABEL[src].toLowerCase()} logged.</div>`;
        return;
      }
      $('#cdList').innerHTML = `<div class="srch-res">${keys.map(k => {
        const list = items(k);
        let t = zero();
        list.forEach(e => { const n = entryNutr(e); MACROS.forEach(m => t[m] += n[m]); });
        const names = list.map(e => e.name).join(', ');
        return `<button class="res" data-copy="${k}">
          <div class="info"><div class="nm">${esc(prettyDate(k))}</div>
            <div class="sub">${list.length} item${list.length > 1 ? 's' : ''} · ${fmt(t.calories)} kcal · P ${fmtG(t.protein)} g</div>
            <div class="sub" style="color:var(--text-3)">${esc(names)}</div></div>
          <span style="color:var(--accent);font-weight:700">Copy</span></button>`;
      }).join('')}</div>`;
      $$('[data-copy]').forEach(b => b.onclick = () => {
        const list = items(b.dataset.copy);
        if (!list.length) return;
        const d = stampDay(target);
        list.forEach(e => d.entries.push({
          ...e, id: uid(), at: Date.now(), nutr: { ...e.nutr }, meal: into || e.meal
        }));
        save(); closeSheet(); render();
        toast(`Copied ${list.length} item${list.length > 1 ? 's' : ''}`);
      });
    };

    $$('#cdSrc .chip').forEach(b => b.onclick = () => {
      src = b.dataset.s; dest = null;
      $$('#cdSrc .chip').forEach(x => x.classList.toggle('on', x === b));
      drawDest(); drawList();
    });
    drawDest(); drawList();
  });
}
/* ============================================================

let foodsTab = 'recipes';
let foodsQuery = '';

function viewFoods() {
  return `
  <div class="apphead"><div class="wrap">
    <div><div class="eyebrow">Library</div><h1 style="margin-top:1px">Foods</h1></div>
    <button class="btn sm primary" data-act="newrecipe">${ICON.plus} Recipe</button>
  </div></div>
  <div class="wrap">
    <div class="chips" id="fTabs">
      ${[['recipes', 'My recipes'], ['meals', 'Saved meals'], ['mine', 'My foods'], ['lib', 'Starter library'], ['fav', 'Favorites']]
      .map(([k, l]) => `<button class="chip ${foodsTab === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}
    </div>
    <div class="field"><input type="text" id="fq" placeholder="Search…" value="${esc(foodsQuery)}"></div>
    <div id="foodsList"></div>
    <div class="card tight">
      <div class="btn-row">
        <button class="btn sm" data-act="newfood">Add a food</button>
        <button class="btn sm" data-act="newrecipe2">Build a recipe</button>
      </div>
      <div class="hint" style="margin-top:9px">Recipes are the accurate way to handle anything you cook yourself —
        egusi, stew, jollof, sauces. Enter the pot once and every serving after that is real arithmetic rather
        than a guess.</div>
    </div>
    <div class="spacer"></div>
  </div>`;
}

function mountFoods() {
  $$('#fTabs .chip').forEach(b => b.onclick = () => { foodsTab = b.dataset.t; render(); });
  $('#fq').oninput = e => { foodsQuery = e.target.value; drawFoodsList(); };
  $$('[data-act=newrecipe],[data-act=newrecipe2]').forEach(b => b.onclick = () => openRecipeBuilder(null));
  $('[data-act=newfood]').onclick = () => openCustomFood(guessMeal(), '', false);
  drawFoodsList();
}

function drawFoodsList() {
  const box = $('#foodsList');
  const q = foodsQuery.trim().toLowerCase();
  const match = n => !q || n.toLowerCase().includes(q);
  let rows = [];
  if (foodsTab === 'recipes') rows = DB.recipes.filter(r => match(r.name)).map(r => ({ t: 'recipe', o: r }));
  else if (foodsTab === 'meals') rows = DB.savedMeals.filter(m => match(m.name)).map(m => ({ t: 'meal', o: m }));
  else if (foodsTab === 'mine') rows = DB.foods.filter(f => f.custom && match(f.name)).map(f => ({ t: 'food', o: f }));
  else if (foodsTab === 'lib') rows = DB.foods.filter(f => f.lib && match(f.name)).map(f => ({ t: 'food', o: f }));
  else rows = [...DB.foods.filter(f => f.favorite && match(f.name)).map(f => ({ t: 'food', o: f })),
  ...DB.recipes.filter(f => f.favorite && match(f.name)).map(f => ({ t: 'recipe', o: f })),
  ...DB.savedMeals.filter(f => f.favorite && match(f.name)).map(f => ({ t: 'meal', o: f }))];

  if (!rows.length) {
    const msg = {
      recipes: 'No recipes yet. Build one for a dish you cook often — it turns an estimate into a real number.',
      meals: 'No saved meals yet. Log a meal on Today, then use “Save as meal”.',
      mine: 'No custom foods yet. Add one from a nutrition label or by hand.',
      lib: 'Nothing matches that search.',
      fav: 'No favorites yet. Tap the star next to any food when adding it.'
    }[foodsTab];
    box.innerHTML = `<div class="card"><div class="empty" style="padding:18px 4px">${esc(msg)}</div></div>`;
    return;
  }
  box.innerHTML = `<div class="card"><div class="srch-res">${rows.map((r, i) => {
    const o = r.o;
    let sub;
    if (r.t === 'recipe') {
      const ps = o.perServing || zero();
      sub = `${fmt(ps.calories)} kcal · P ${fmtG(ps.protein)} g per serving · ${o.ingredients.length} ingredients`;
    } else if (r.t === 'meal') {
      const n = savedMealNutr(o);
      sub = `${o.items.length} items · ${fmt(n.calories)} kcal · P ${fmtG(n.protein)} g`;
    } else {
      sub = `${fmt(o.nutr.calories)} kcal per ${o.ref.amount === 1 ? '' : fmtG(o.ref.amount) + ' '}${o.ref.unit}`;
    }
    return `<div class="res">
      <button style="flex:1;min-width:0;background:none;border:none;text-align:left;padding:0" data-open="${i}">
        <span class="nm" style="display:block">${esc(o.name)}
          ${o.estimate ? '<span class="badge est">Est</span>' : ''}
          ${r.t === 'recipe' ? '<span class="badge rec">Recipe</span>' : ''}
          ${r.t === 'meal' ? '<span class="badge">Meal</span>' : ''}</span>
        <span class="sub" style="display:block">${esc(sub)}</span>
      </button>
      <button class="star ${o.favorite ? 'on' : ''}" data-fav="${i}">${o.favorite ? '★' : '☆'}</button>
      <button class="btn sm" data-log="${i}">Log</button>
    </div>`;
  }).join('')}</div></div>`;

  $$('[data-open]').forEach(b => b.onclick = () => {
    const r = rows[parseInt(b.dataset.open, 10)];
    if (r.t === 'recipe') openRecipeBuilder(r.o);
    else if (r.t === 'meal') openSavedMealEditor(r.o);
    else openCustomFood(guessMeal(), '', false, r.o);
  });
  $$('[data-fav]').forEach(b => b.onclick = () => {
    const r = rows[parseInt(b.dataset.fav, 10)];
    r.o.favorite = !r.o.favorite; save(); drawFoodsList();
  });
  $$('[data-log]').forEach(b => b.onclick = () => {
    const r = rows[parseInt(b.dataset.log, 10)];
    if (r.t === 'meal') { addCtx.meal = r.o.meal || guessMeal(); addSavedMeal(r.o); }
    else if (r.t === 'recipe') openPortion(recipeToFood(r.o), guessMeal());
    else openPortion(r.o, guessMeal());
  });
}

  const body = `
    <div class="card tight" style="box-shadow:none;margin-bottom:14px">

          <div class="sub" style="font-size:12.5px;color:var(--text-2)">${esc(describeServing(e))} · ${fmt(en.calories)} kcal</div></div>

  }).join('')}</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn sm" data-act="logit">Log this meal now</button>

    $('[data-act=delmeal]').onclick = () => confirmSheet('Delete meal?', `“${m.name}” will be removed. Days you've already logged it on are unaffected.`,
      'Delete', () => { DB.savedMeals = DB.savedMeals.filter(x => x.id !== m.id); save(); closeSheet(true); render(); toast('Deleted'); }, true);
    $('#sheetFoot [data-act=cancel]').onclick = () => closeSheet();
    $('#sheetFoot [data-act=save]').onclick = () => {

/* ============================================================
   RECIPE BUILDER
   ============================================================ */
let RB = null;   // working recipe

function openRecipeBuilder(existing, presetName) {
  RB = existing
    ? JSON.parse(JSON.stringify(existing))
    : {
      id: 'rec_' + uid(), name: presetName || '', ingredients: [], servings: 4,
      totalWeight: null, mode: 'servings', favorite: false, createdAt: Date.now()
    };
  if (!RB.mode) RB.mode = RB.totalWeight ? 'weight' : 'servings';
  drawRecipeBuilder(!!existing);
}

function drawRecipeBuilder(isEdit) {
  recomputeRecipe(RB);
  const t = RB.total, ps = RB.perServing;
  const servings = Math.max(num(RB.servings, 1), 0.01);

  const body = `
    <div class="field"><label for="rName">Recipe name</label>
      <input type="text" id="rName" placeholder="e.g. My egusi soup, Sunday stew" value="${esc(RB.name)}"></div>

    <h3 style="font-size:14px;margin:16px 0 4px">Ingredients</h3>
    ${RB.ingredients.length ? `<div id="rIngs">${RB.ingredients.map((ing, i) => {
    const n = entryNutr(ing);
    return `<div class="ing-row">
        <div class="info">
          <div style="font-size:14.5px;font-weight:600">${esc(ing.name)} ${ing.estimate ? '<span class="badge est">Est</span>' : ''}</div>
          <div style="font-size:12.5px;color:var(--text-2)">${esc(describeServing(ing))} · ${fmt(n.calories)} kcal ·
            P ${fmtG(n.protein)} · C ${fmtG(n.carbs)} · F ${fmtG(n.fat)}</div>
        </div>
        <button class="btn sm" data-edit="${i}">Edit</button>
        <button class="btn sm danger" data-rm="${i}">✕</button>
      </div>`;
  }).join('')}</div>`
      : `<div class="empty" style="padding:14px 4px">No ingredients yet. Add everything that goes into the pot,
           including the oil — oil is usually the single biggest calorie source in Nigerian cooking.</div>`}
    <button class="btn wide" data-act="addIng" style="margin-top:10px">${ICON.plus} Add ingredient</button>

    ${RB.ingredients.length ? `
    <div class="card tight" style="margin-top:16px;box-shadow:none">
      <div class="card-h" style="margin-bottom:6px"><h3 style="font-size:14px">Whole pot</h3>
        ${RB.estimate ? '<span class="badge est">Contains estimates</span>' : '<span class="badge">Calculated</span>'}</div>
      <div class="kv"><span class="k">Calories</span><span class="v">${fmt(t.calories)} kcal</span></div>
      <div class="kv"><span class="k">Protein</span><span class="v">${fmtG(t.protein)} g</span></div>
      <div class="kv"><span class="k">Carbs</span><span class="v">${fmtG(t.carbs)} g</span></div>
      <div class="kv"><span class="k">Fat</span><span class="v">${fmtG(t.fat)} g</span></div>
      <div class="kv"><span class="k">Fiber</span><span class="v">${fmtG(t.fiber)} g</span></div>
    </div>

    <div class="field" style="margin-top:16px"><span class="lbl">Divide the pot by</span>
      <div class="seg" id="rMode">
        <button data-mode="servings" class="${RB.mode === 'servings' ? 'on' : ''}">Number of servings</button>
        <button data-mode="weight" class="${RB.mode === 'weight' ? 'on' : ''}">Total cooked weight</button>
      </div>
    </div>
    ${RB.mode === 'servings'
        ? `<div class="field"><label for="rServ">How many servings does this pot make?</label>
           <input type="number" id="rServ" inputmode="decimal" step="any" min="0.5" value="${esc(RB.servings)}">
           <div class="hint">Count how many times you'll eat from it. Rough is fine — you can change it later
             and every future log updates.</div></div>
         <div class="field"><label for="rTW">Total cooked weight <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>
           <input type="number" id="rTW" inputmode="decimal" step="any" placeholder="grams — lets you log by weight later"
             value="${RB.totalWeight ? esc(RB.totalWeight) : ''}"></div>`
        : `<div class="field"><label for="rTW2">Total cooked weight of the pot (g)</label>
           <input type="number" id="rTW2" inputmode="decimal" step="any" placeholder="e.g. 2400"
             value="${RB.totalWeight ? esc(RB.totalWeight) : ''}">
           <div class="hint">Weigh the finished pot (minus the pot itself). This is the most accurate option —
             you can then log any serving by weight.</div></div>
         <div class="field"><label for="rServ2">Serving size (g)</label>
           <input type="number" id="rServ2" inputmode="decimal" step="any" placeholder="e.g. 250"
             value="${RB.servingWeight ? r0(RB.servingWeight) : ''}"></div>`}

    <div class="card tight" style="box-shadow:none;border-color:var(--accent)">
      <div class="card-h" style="margin-bottom:6px"><h3 style="font-size:14px">Per serving</h3>
        <span style="font-size:12.5px;color:var(--text-2)">${RB.mode === 'weight' && RB.servingWeight
          ? `${r0(RB.servingWeight)} g each` : `pot ÷ ${r1(servings)}`}</span></div>
      <div style="display:flex;align-items:baseline;gap:9px">
        <div style="font-size:31px;font-weight:750;color:var(--cal);letter-spacing:-.03em">${fmt(ps.calories)}</div>
        <div style="font-size:13.5px;color:var(--text-2)">kcal per serving</div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px">
        <span><b style="color:var(--pro)">${fmtG(ps.protein)} g</b> protein</span>
        <span><b style="color:var(--carb)">${fmtG(ps.carbs)} g</b> carbs</span>
        <span><b style="color:var(--fat)">${fmtG(ps.fat)} g</b> fat</span>
        <span><b style="color:var(--fib)">${fmtG(ps.fiber)} g</b> fiber</span>
      </div>
      ${RB.estimate ? `<div class="hint" style="margin-top:9px">Some ingredients are themselves estimates, so this
        carries their uncertainty. It's still far closer than a generic dish value.</div>` : ''}
    </div>

    <div class="field" style="margin-top:14px"><label for="rNote">Notes <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>
      <textarea id="rNote" rows="2" placeholder="e.g. used 3 cooking spoons of palm oil">${esc(RB.note || '')}</textarea></div>
    ` : ''}

    ${isEdit ? `<div class="btn-row" style="margin-top:14px">
      <button class="btn sm danger" data-act="delrec">Delete recipe</button></div>` : ''}`;

  const foot = `<button class="btn" data-act="cancel">Cancel</button>
    <button class="btn primary" data-act="save" ${RB.ingredients.length ? '' : 'disabled'}>
      ${isEdit ? 'Save recipe' : 'Save recipe'}</button>`;

  const mount = () => {
    $('#rName').oninput = e => { RB.name = e.target.value; };
    $('[data-act=addIng]').onclick = () => openIngredientPicker();
    $$('[data-edit]').forEach(b => b.onclick = () => openIngredientPicker(parseInt(b.dataset.edit, 10)));
    $$('[data-rm]').forEach(b => b.onclick = () => {
      RB.ingredients.splice(parseInt(b.dataset.rm, 10), 1);
      replaceSheetRecipe(isEdit);
    });
    const modeBtns = $$('#rMode button');
    modeBtns.forEach(b => b.onclick = () => { readRecipeInputs(); RB.mode = b.dataset.mode; replaceSheetRecipe(isEdit); });
    ['rServ', 'rTW', 'rTW2', 'rServ2'].forEach(id => {
      const el = $('#' + id); if (el) el.oninput = () => { readRecipeInputs(); refreshPerServing(); };
    });
    const nt = $('#rNote'); if (nt) nt.oninput = e => { RB.note = e.target.value; };
    const dr = $('[data-act=delrec]'); if (dr) dr.onclick = () => confirmSheet('Delete recipe?',
      `“${RB.name || 'This recipe'}” will be removed. Meals you've already logged with it keep their numbers.`,
      'Delete', () => {
        DB.recipes = DB.recipes.filter(r => r.id !== RB.id); save(); closeSheet(true); render(); toast('Recipe deleted');
      }, true);
    $('#sheetFoot [data-act=cancel]').onclick = () => closeSheet();
    $('#sheetFoot [data-act=save]').onclick = saveRecipe;
  };

  if (sheetStack.length && sheetStack[sheetStack.length - 1].isRecipe) {
    sheetStack.pop();
    sheetStack.push({ title: isEdit ? 'Edit recipe' : 'Recipe builder', bodyHTML: body, footHTML: foot, onMount: mount, isRecipe: true });
    renderSheet();
  } else {
    sheetStack.push({ title: isEdit ? 'Edit recipe' : 'Recipe builder', bodyHTML: body, footHTML: foot, onMount: mount, isRecipe: true });
    renderSheet();
  }

  function replaceSheetRecipe(ed) { drawRecipeBuilder(ed); }
  function readRecipeInputs() {
    const nm = $('#rName'); if (nm) RB.name = nm.value;
    if (RB.mode === 'servings') {
      const s = $('#rServ'); if (s) RB.servings = num(s.value, 1) || 1;
      const w = $('#rTW'); RB.totalWeight = w && w.value ? num(w.value) : null;
    } else {
      const w = $('#rTW2'); RB.totalWeight = w && w.value ? num(w.value) : null;
      const sw = $('#rServ2'); const sv = sw ? num(sw.value) : 0;
      if (RB.totalWeight && sv > 0) { RB.servings = RB.totalWeight / sv; RB.servingWeight = sv; }
    }
  }
  function refreshPerServing() { drawRecipeBuilder(isEdit); }
  function saveRecipe() {
    readRecipeInputs();
    if (!(RB.name || '').trim()) { toast('Give the recipe a name'); return; }
    if (!RB.ingredients.length) { toast('Add at least one ingredient'); return; }
    recomputeRecipe(RB);
    const i = DB.recipes.findIndex(r => r.id === RB.id);
    if (i >= 0) DB.recipes[i] = RB; else DB.recipes.push(RB);
    save(); closeSheet(true);
    VIEW = 'foods'; foodsTab = 'recipes'; render();
    toast('Recipe saved');
  }
}

/* ---------- ingredient picker (search -> amount) ---------- */
function openIngredientPicker(editIndex) {

  let q = '';
  const body = `

  openSheet(editing ? 'Change ingredient' : 'Add ingredient', body, `<button class="btn" data-act="cancel">Cancel</button>`, () => {
    const box = $('#iRes');
    const draw = () => {
      const rows = searchAll(q).filter(r => r.type === 'food').slice(0, 40);
      box.innerHTML = rows.length ? `<div class="srch-res">${rows.map((r, i) => `
        <button class="res" data-i="${i}">
          <div class="info"><div class="nm">${esc(r.item.name)} ${r.item.estimate ? '<span class="badge est">Est</span>' : ''}</div>
            <div class="sub">${fmt(r.item.nutr.calories)} kcal per ${r.item.ref.amount === 1 ? '' : fmtG(r.item.ref.amount) + ' '}${esc(r.item.ref.unit)}</div></div>

/* History uses the same semantics as Today: floors green when met, the
   calorie budget red when over, and flexible macros neutral while calories
   hold — a fat overage must not read as alarm in one screen and "fine" in
   the other. */
function histStatColour(key, got, goal, calOk) {
  const kind = MACRO_META[key].kind;
  if (kind === 'floor') return got >= goal * 0.95 ? 'var(--good)' : MACRO_META[key].color;
  if (kind === 'budget') return got > goal ? 'var(--over)' : MACRO_META[key].color;
  if (got > goal) return calOk ? MACRO_META[key].color : 'var(--warn)';
  return MACRO_META[key].color;
}

/* ============================================================
   PROGRESS — weekly/monthly averages, charts, weight trend
   ============================================================ */
let progRange = 7;

function loggedDays() {
  return Object.keys(DB.days).filter(k => DB.days[k].entries && DB.days[k].entries.length).sort();
}
function rangeKeys(n) {
  const out = [], t = todayKey();
  for (let i = n - 1; i >= 0; i--) out.push(shiftKey(t, -i));
  return out;
}
function statsFor(keys) {
  const logged = keys.filter(k => DB.days[k] && DB.days[k].entries && DB.days[k].entries.length);
  const sums = zero();
  logged.forEach(k => { const d = dayTotals(k); MACROS.forEach(m => sums[m] += d[m]); });
  const n = logged.length || 1;
  const avg = {}; MACROS.forEach(m => avg[m] = sums[m] / n);
  // each day is judged against the target that applied to it, so recalculating
  // today never moves a historical hit-rate
  const calMet = logged.filter(k => dayTotals(k).calories <= targetsFor(k).calories).length;
  const proMet = logged.filter(k => dayTotals(k).protein >= targetsFor(k).protein * 0.95).length;
  // average the targets that actually applied, across every macro — and the
  // TDEE too, so the deficit figure reflects the plan of the time
  const tSum = zero(); let tdeeSum = 0;
  logged.forEach(k => {
    const tt = targetsFor(k);
    MACROS.forEach(m => tSum[m] += (tt[m] || 0));
    tdeeSum += (tt.tdee || (DB.targets ? DB.targets.tdee : 0) || 0);
  });
  const avgTarget = {};
  MACROS.forEach(m => avgTarget[m] = logged.length ? tSum[m] / logged.length
    : (DB.targets ? DB.targets[m] : 0));
  const avgTdee = logged.length ? tdeeSum / logged.length : (DB.targets ? DB.targets.tdee : 0);
  const anyFallback = logged.some(k => usesFallbackTargets(k));
  // any macro changing counts, not just calories
  const first = logged.length ? targetsFor(logged[0]) : null;
  const targetsVaried = !!first && logged.some(k => {
    const tt = targetsFor(k);
    return MACROS.some(m => tt[m] !== first[m]);
  });
  return {
    avg, loggedCount: logged.length, total: keys.length, logged,
    avgTarget, avgTdee,
    avgTargetCalories: avgTarget.calories, avgTargetProtein: avgTarget.protein,
    anyFallback, targetsVaried,
    calMetPct: logged.length ? (calMet / logged.length) * 100 : 0,
    proMetPct: logged.length ? (proMet / logged.length) * 100 : 0
  };
}
function weightSeries() {
  return Object.keys(DB.days).filter(k => DB.days[k].weight).sort()
    .map(k => ({ k, w: DB.days[k].weight }));
}
function movingAvg(series, win) {
  return series.map((pt, i) => {
    const from = parseKey(pt.k).getTime() - (win - 1) * 86400000;
    const sub = series.filter((p, j) => j <= i && parseKey(p.k).getTime() >= from);
    return { k: pt.k, w: sub.reduce((a, b) => a + b.w, 0) / sub.length };
  });
}

/* ------------------------------------------------------------
   TARGET DRIFT
   Maintenance falls as weight does, and the per-day snapshots exist
   precisely because targets are expected to change — but nothing told the
   person when. This compares the 7-day average against the weight the
   targets were computed at. It goes by the smoothed line, not a single
   weigh-in, and wants two consecutive readings to agree, so one salty
   dinner or a weekly weigh-in outlier can't trigger it on its own.
   ------------------------------------------------------------ */
const RECALC_AFTER_KG = 2.5;
function weightDrift() {
  const t = DB.targets, p = DB.profile;
  if (!t || !p || t.atWeightKg == null) return null;
  const ws = weightSeries();
  if (ws.length < 2) return null;
  const wma = movingAvg(ws, 7);
  const last = wma[wma.length - 1], prev = wma[wma.length - 2];
  const goal = num(p.goalWeightKg, 0);
  // reaching the goal takes precedence: the plan still carries a deficit
  if (goal && last.w <= goal && prev.w <= goal) {
    return { goal: true, nowKg: last.w, atKg: t.atWeightKg, goalKg: goal, diffKg: last.w - t.atWeightKg, since: last.k };
  }
  const diff = last.w - t.atWeightKg, prevDiff = prev.w - t.atWeightKg;
  if (Math.abs(diff) < RECALC_AFTER_KG || Math.abs(prevDiff) < RECALC_AFTER_KG) return null;
  if (Math.sign(diff) !== Math.sign(prevDiff)) return null;
  return { goal: false, nowKg: last.w, atKg: t.atWeightKg, goalKg: goal, diffKg: diff, since: last.k };
}

/* ------------------------------------------------------------
   DEFICIT vs ACTUAL — the one check the app could make and didn't.

   Two independent numbers are already recorded: what was logged against the
   estimated maintenance, and what the scale actually did. The first predicts
   a rate of loss; the second measures it. Where they disagree, the estimate
   (population formula, ±10%) or the logging is off — and the measured trend
   is the one to believe. Inverting it gives an implied maintenance, which is
   a far better number for this person than any formula.

   It refuses to answer on thin data: a fortnight of scale noise can imply
   almost any maintenance, and a confident wrong number here would be worse
   than no number.
   ------------------------------------------------------------ */
const KCAL_PER_KG = 7700;
const REALITY_MIN_DAYS = 14, REALITY_MIN_WEIGHINS = 4, REALITY_MIN_LOGGED = 10;

function energyReality(keys, s) {
  if (!DB.targets || !s.loggedCount) return null;
  const inRange = new Set(keys);
  const pts = weightSeries().filter(p => inRange.has(p.k));
  const spanDays = pts.length >= 2
    ? (parseKey(pts[pts.length - 1].k) - parseKey(pts[0].k)) / 86400000 : 0;
  const short = {
    ready: false, weighIns: pts.length, spanDays: r0(spanDays), logged: s.loggedCount,
    needWeighIns: REALITY_MIN_WEIGHINS, needDays: REALITY_MIN_DAYS, needLogged: REALITY_MIN_LOGGED
  };
  if (pts.length < REALITY_MIN_WEIGHINS || spanDays < REALITY_MIN_DAYS || s.loggedCount < REALITY_MIN_LOGGED) return short;

  // least squares over the raw weigh-ins: uses every point rather than
  // differencing two of them, so a single odd morning barely moves it
  const t0 = parseKey(pts[0].k).getTime();
  const xs = pts.map(p => (parseKey(p.k).getTime() - t0) / 86400000);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length;
  const my = pts.reduce((a, p) => a + p.w, 0) / pts.length;
  let sxy = 0, sxx = 0;
  xs.forEach((x, i) => { sxy += (x - mx) * (pts[i].w - my); sxx += (x - mx) * (x - mx); });
  if (sxx <= 0) return short;
  const actualPerWeek = (sxy / sxx) * 7;                    // kg/week, negative = losing

  const intake = s.avg.calories, tdee = s.avgTdee;
  const predictedPerWeek = -((tdee - intake) * 7) / KCAL_PER_KG;
  const impliedTdee = intake + (-actualPerWeek * KCAL_PER_KG) / 7;
  // logging gaps inflate the apparent deficit, because unlogged days count as
  // nothing rather than as a normal day
  const coverage = s.loggedCount / (spanDays + 1);
  return {
    ready: true, weighIns: pts.length, spanDays: r0(spanDays), logged: s.loggedCount,
    intake, tdee, predictedPerWeek, actualPerWeek, impliedTdee,
    gapPerWeek: actualPerWeek - predictedPerWeek,
    tdeeGap: impliedTdee - tdee, coverage
  };
}

function realityCardHTML(keys, s) {
  const R = energyReality(keys, s);
  if (!R) return '';
  const unit = DB.settings.units === 'metric' ? 'kg' : 'lb';
  const W = v => r1(DB.settings.units === 'metric' ? v : kgToLb(v));
  const sign = v => (v > 0 ? '+' : '') + W(v);

  if (!R.ready) {
    const need = [];
    if (R.weighIns < R.needWeighIns) need.push(`at least ${R.needWeighIns} weigh-ins in this window (you have ${R.weighIns})`);
    if (R.spanDays < R.needDays) need.push(`weigh-ins spanning ${R.needDays}+ days (currently ${R.spanDays})`);
    if (R.logged < R.needLogged) need.push(`${R.needLogged}+ logged days (you have ${R.logged})`);
    return `<div class="card">
      <div class="card-h"><h3>Is the estimate right?</h3></div>
      <div class="empty" style="padding:6px 4px 10px;text-align:left">
        Once there's enough data, this compares what you logged against what the scale did, and works out your real
        maintenance calories rather than the formula's guess. It needs ${need.join(', ')}.${progRange === 7
        ? ' Try the 30-day window too.' : ''}</div></div>`;
  }

  const losing = R.actualPerWeek < -0.02;
  const closeRate = Math.abs(R.gapPerWeek) < 0.15;         // kg/week, inside scale noise
  let verdict, tone;
  if (closeRate) {
    tone = 'var(--good)';
    verdict = `Your logged intake predicted <b>${sign(R.predictedPerWeek)} ${unit}/week</b> and the scale shows
      <b>${sign(R.actualPerWeek)}</b>. Those agree, which means the maintenance estimate of
      ${fmt(R.tdee)} kcal is about right for you and the plan is doing what it says.`;
  } else if (R.gapPerWeek > 0) {
    tone = 'var(--warn)';
    verdict = `Your logged intake predicted <b>${sign(R.predictedPerWeek)} ${unit}/week</b>, but the scale shows
      <b>${sign(R.actualPerWeek)}</b> — ${losing ? 'slower than expected' : 'the wrong direction'}. Taken at face
      value your maintenance is nearer <b>${fmt(R.impliedTdee)} kcal</b> than the estimated ${fmt(R.tdee)},
      i.e. ${fmt(Math.abs(R.tdeeGap))} kcal ${R.tdeeGap < 0 ? 'lower' : 'higher'}. The other common explanation is
      intake that isn't reaching the log — cooking oil, drinks, tastes while cooking, a day skipped after a big meal.`;
  } else {
    tone = 'var(--good)';
    verdict = `The scale is moving <b>faster</b> than your logging predicted: <b>${sign(R.actualPerWeek)} ${unit}/week</b>
      against a predicted ${sign(R.predictedPerWeek)}. That points to a maintenance nearer
      <b>${fmt(R.impliedTdee)} kcal</b> than ${fmt(R.tdee)}. Worth checking it isn't a faster deficit than you
      intended — if the rate is above about 1% of bodyweight a week, eating a little more protects muscle.`;
  }

  return `<div class="card">
    <div class="card-h"><h3>Is the estimate right?</h3><span class="badge est">Estimate</span></div>
    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat"><div class="l">Predicted change</div>
        <div class="n" style="font-size:19px">${sign(R.predictedPerWeek)} <span style="font-size:12px">${unit}/wk</span></div>
        <div class="s">from ${fmt(R.intake)} kcal logged</div></div>
      <div class="stat"><div class="l">Actual change</div>
        <div class="n" style="font-size:19px;color:${tone}">${sign(R.actualPerWeek)} <span style="font-size:12px">${unit}/wk</span></div>
        <div class="s">trend of ${R.weighIns} weigh-ins</div></div>
      <div class="stat"><div class="l">Estimated maintenance</div>
        <div class="n" style="font-size:19px">${fmt(R.tdee)}</div>
        <div class="s">kcal, from the formula</div></div>
      <div class="stat"><div class="l">Implied maintenance</div>
        <div class="n" style="font-size:19px;color:var(--accent)">${fmt(R.impliedTdee)}</div>
        <div class="s">kcal, from your own data</div></div>
    </div>
    <div class="coach-line"><span class="ic">${closeRate ? '✅' : '🔍'}</span><span>${verdict}</span></div>
    ${R.coverage < 0.8 ? `<div class="coach-line"><span class="ic">📋</span><span>
      You logged ${R.logged} of the ${R.spanDays + 1} days in this span. Unlogged days count as nothing here rather
      than as a normal day, so the real average intake is probably higher than ${fmt(R.intake)} kcal and the
      implied maintenance correspondingly higher too.</span></div>` : ''}

      ${fmt(KCAL_PER_KG)} kcal per kg of bodyweight, portion sizes carry error, and water and glycogen move the
      scale independently of fat. Treat it as a direction rather than a measurement, and act on it only if it holds
      over another couple of weeks — then adjust by 100–200 kcal rather than jumping to the implied number.</div>
  </div>`;
}

function mountProgress() {
  $$('#rangeSeg button').forEach(b => b.onclick = () => { progRange = parseInt(b.dataset.r, 10); render(); });
  const keys = rangeKeys(progRange);
  const cc = $('#cChart');
  if (cc) drawBars(cc, keys.map(k => ({ k, v: dayTotals(k).calories, t: targetsFor(k).calories })), 'cal');
  const pc = $('#pChart');
  if (pc) drawBars(pc, keys.map(k => ({ k, v: dayTotals(k).protein, t: targetsFor(k).protein })), 'pro');
  const wc = $('#wChart');
  if (wc) drawWeight(wc);
}

/* ---------- canvas charts (no dependencies) ---------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.parentElement.clientWidth || 300;
  const h = parseInt(cv.getAttribute('height'), 10) || 160;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
function drawBars(cv, data, kind) {
  const { ctx, w, h } = setupCanvas(cv);
  const pad = { l: 38, r: 8, t: 10, b: 20 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const maxTarget = Math.max(...data.map(d => d.t), 1);
  const max = Math.max(maxTarget * 1.25, ...data.map(d => d.v), 1);
  const color = kind === 'cal' ? cssVar('--cal') : cssVar('--pro');
  const over = cssVar('--over'), grid = cssVar('--border'), txt = cssVar('--text-3');

  ctx.strokeStyle = grid; ctx.lineWidth = 1; ctx.font = '10px -apple-system,system-ui,sans-serif';
  ctx.fillStyle = txt; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 2; i++) {
    const v = (max / 2) * i, y = pad.t + ih - (v / max) * ih;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(r0(v), pad.l - 6, y);
  }
  const n = data.length;
  const bw = Math.max(2, Math.min(26, (iw / n) * 0.62));
  const step = iw / n;
  data.forEach((d, i) => {
    if (d.v <= 0) return;
    const bh = (d.v / max) * ih;
    const x = pad.l + step * i + (step - bw) / 2;
    const y = pad.t + ih - bh;
    // compared against that day's own target, not today's
    ctx.fillStyle = (kind === 'cal' ? d.v > d.t : d.v < d.t * 0.95) ? over : color;
    const r = Math.min(3, bw / 2);
    ctx.beginPath();
    ctx.moveTo(x, y + bh); ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.lineTo(x + bw - r, y); ctx.quadraticCurveTo(x + bw, y, x + bw, y + r);
    ctx.lineTo(x + bw, y + bh); ctx.closePath(); ctx.fill();
  });
  // target line — stepped, because the target itself can change over time
  ctx.strokeStyle = cssVar('--text-2'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.4;
  ctx.beginPath();
  data.forEach((d, i) => {
    const ty = pad.t + ih - (d.t / max) * ih;
    const x0 = pad.l + step * i, x1 = x0 + step;
    if (i === 0) ctx.moveTo(x0, ty); else ctx.lineTo(x0, ty);
    ctx.lineTo(x1, ty);
  });
  ctx.stroke();
  ctx.setLineDash([]);
  // x labels: first / mid / last
  ctx.fillStyle = txt; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const lab = i => { const d = parseKey(data[i].k); return `${d.getMonth() + 1}/${d.getDate()}`; };
  if (n) {
    ctx.fillText(lab(0), pad.l + step * 0.5, pad.t + ih + 5);
    if (n > 2) ctx.fillText(lab(Math.floor(n / 2)), pad.l + step * (Math.floor(n / 2) + 0.5), pad.t + ih + 5);
    if (n > 1) ctx.fillText(lab(n - 1), pad.l + step * (n - 0.5), pad.t + ih + 5);
  }
}
function drawWeight(cv) {
  const { ctx, w, h } = setupCanvas(cv);
  const ws = weightSeries(); if (ws.length < 2) return;
  const wma = movingAvg(ws, 7);
  const conv = v => DB.settings.units === 'metric' ? v : kgToLb(v);
  const pad = { l: 40, r: 10, t: 12, b: 20 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const vals = ws.map(p => conv(p.w)).concat(wma.map(p => conv(p.w)));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = Math.max(hi - lo, DB.settings.units === 'metric' ? 1.5 : 3);
  lo -= span * 0.18; hi += span * 0.18;
  const t0 = parseKey(ws[0].k).getTime(), t1 = parseKey(ws[ws.length - 1].k).getTime();
  const X = k => pad.l + (t1 === t0 ? iw / 2 : ((parseKey(k).getTime() - t0) / (t1 - t0)) * iw);
  const Y = v => pad.t + ih - ((v - lo) / (hi - lo)) * ih;

  ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1;
  ctx.font = '10px -apple-system,system-ui,sans-serif'; ctx.fillStyle = cssVar('--text-3');
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 2; i++) {
    const v = lo + ((hi - lo) / 2) * i, y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(r1(v), pad.l - 6, y);
  }
  // raw dots
  ctx.fillStyle = cssVar('--text-3');
  ws.forEach(p => { ctx.beginPath(); ctx.arc(X(p.k), Y(conv(p.w)), 2.6, 0, 7); ctx.fill(); });
  // moving average line
  ctx.strokeStyle = cssVar('--accent'); ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.beginPath();
  wma.forEach((p, i) => { const x = X(p.k), y = Y(conv(p.w)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.fillStyle = cssVar('--text-3'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const f = parseKey(ws[0].k), l = parseKey(ws[ws.length - 1].k);
  ctx.fillText(`${f.getMonth() + 1}/${f.getDate()}`, pad.l + 8, pad.t + ih + 5);
  ctx.fillText(`${l.getMonth() + 1}/${l.getDate()}`, w - pad.r - 12, pad.t + ih + 5);
}
/* ============================================================
   MEAL PREVIEW — build a meal, see its effect, then commit
   PREVIEW is null when not planning. While it is set, the add-food
   flow stages into it instead of writing to the day.
   ============================================================ */
let PREVIEW = null;   // { meal, items: [entry] }

function openMealPreview(meal) {
  PREVIEW = { meal: meal || guessMeal(), items: [] };
  drawPreview();
}
function previewTotals() {
  let t = zero();
  if (!PREVIEW) return t;
  PREVIEW.items.forEach(e => { const n = entryNutr(e); MACROS.forEach(m => t[m] += n[m]); });
  return t;
}

/* Plain-language read on whether the planned meal fits, following the
   hierarchy: calories first, then protein, then fiber, then the flexible
   carb/fat split. Never moralising, always numeric. */
function previewVerdict(now, add, tg) {
  const after = {}; MACROS.forEach(m => after[m] = now[m] + add[m]);
  const lines = [];
  const calLeftBefore = tg.calories - now.calories;
  const calLeftAfter = tg.calories - after.calories;

  if (calLeftAfter >= 0) {
    lines.push(['✅', `This fits your calorie budget with <b>${fmt(calLeftAfter)} kcal</b> still to spare.`]);
  } else if (Math.abs(calLeftAfter) <= tg.calories * 0.05) {
    lines.push(['🟡', `This puts you <b>${fmt(Math.abs(calLeftAfter))} kcal</b> over — within a rounding error of your
      budget, and well inside the day-to-day noise of portion estimates.`]);
  } else {
    const trim = Math.abs(calLeftAfter);
    const biggest = PREVIEW.items.reduce((a, b) => entryNutr(a).calories > entryNutr(b).calories ? a : b, PREVIEW.items[0]);
    const bn = biggest ? entryNutr(biggest) : null;
    lines.push(['🔴', `This would put you <b>${fmt(trim)} kcal over</b> your budget for the day.
      ${bn && bn.calories > trim ? `Cutting ${esc(biggest.name)} by about
        ${r0((trim / bn.calories) * 100)}% would bring it back in.` : ''}`]);
  }

  const proAfter = tg.protein - after.protein;
  if (proAfter <= 0) lines.push(['💪', `Protein lands at <b>${fmtG(after.protein)} g</b>, at or above your ${tg.protein} g minimum.`]);
  else if (add.protein > 0) lines.push(['💪', `Adds ${fmtG(add.protein)} g protein — you'd still be
    <b>${fmtG(proAfter)} g short</b> of your ${tg.protein} g minimum for the day.`]);
  else lines.push(['💪', `No protein in this, so you'd still need <b>${fmtG(proAfter)} g</b> today.`]);

  if (tg.fiber - after.fiber > 0 && add.fiber < 3) {
    lines.push(['🌿', `Fiber would sit at ${fmtG(after.fiber)} of ${tg.fiber} g. A vegetable side is the easy fix.`]);
  }
  const fatOver = after.fat - tg.fat, carbOver = after.carbs - tg.carbs;
  if ((fatOver > 3 || carbOver > 5) && calLeftAfter >= 0) {
    lines.push(['⚖️', `It runs ${fatOver > 3 ? `${fmtG(fatOver)} g over your fat allocation` : ''}${fatOver > 3 && carbOver > 5 ? ' and ' : ''}${carbOver > 5 ? `${fmtG(carbOver)} g over carbs` : ''},
      but calories still fit — the split between the two is flexible, so this isn't worth changing on its own.`]);
  }
  return lines;
}

function drawPreview() {
  const tg = targetsFor(CUR);
  const now = dayTotals(CUR);
  const add = previewTotals();
  const has = PREVIEW.items.length > 0;
  const after = {}; MACROS.forEach(m => after[m] = now[m] + add[m]);
  const pvCtx = { calOk: after.calories <= tg.calories };

  const body = `
    <div class="field" style="margin-bottom:12px"><span class="lbl">Planning for</span>
      <div class="seg" id="pvMeal">${MEALS.map(m =>
    `<button data-m="${m}" class="${PREVIEW.meal === m ? 'on' : ''}">${MEAL_LABEL[m]}</button>`).join('')}</div>
    </div>

    <div id="pvItems">${has ? PREVIEW.items.map((e, i) => {
      const n = entryNutr(e);
      return `<div class="ing-row">
        <div class="info"><div style="font-weight:600;font-size:14.5px">${esc(e.name)}
            ${e.estimate ? '<span class="badge est">Est</span>' : ''}</div>
          <div style="font-size:12.5px;color:var(--text-2)">${esc(describeServing(e))} · ${fmt(n.calories)} kcal ·
            P ${fmtG(n.protein)} · C ${fmtG(n.carbs)} · F ${fmtG(n.fat)}</div></div>
        <button class="btn sm" data-pvedit="${i}">Edit</button>
        <button class="btn sm danger" data-pvrm="${i}">✕</button></div>`;
    }).join('') : `<div class="empty" style="padding:16px 4px">
        Add what you're thinking of eating. Nothing is logged until you tap Log meal.</div>`}</div>

    <button class="btn wide" data-act="pvAdd" style="margin-top:10px">${ICON.plus} Add to this meal</button>

    ${has ? `
      <div class="card tight" style="margin-top:16px;box-shadow:none">
        <div class="card-h" style="margin-bottom:6px"><h3 style="font-size:14px">If you eat this</h3></div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:14px">
          <span><b style="color:var(--cal)">+${fmt(add.calories)}</b> kcal</span>
          <span><b style="color:var(--pro)">+${fmtG(add.protein)} g</b> protein</span>
          <span><b style="color:var(--carb)">+${fmtG(add.carbs)} g</b> carbs</span>
          <span><b style="color:var(--fat)">+${fmtG(add.fat)} g</b> fat</span>
          <span><b style="color:var(--fib)">+${fmtG(add.fiber)} g</b> fiber</span>
        </div>
      </div>

      <h3 style="font-size:14px;margin:16px 0 8px">${esc(prettyDate(CUR))} after this meal</h3>
      ${barRow('calories', after.calories, tg.calories, pvCtx)}
      <div class="macro-grid" style="margin-top:12px">
        ${barRow('protein', after.protein, tg.protein, pvCtx)}
        ${barRow('fiber', after.fiber, tg.fiber, pvCtx)}
        ${barRow('carbs', after.carbs, tg.carbs, pvCtx)}
        ${barRow('fat', after.fat, tg.fat, pvCtx)}
      </div>

      <div class="card tight" style="margin-top:14px;box-shadow:none">
        ${previewVerdict(now, add, tg).map(([ic, txt]) =>
        `<div class="coach-line"><span class="ic">${ic}</span><span>${txt}</span></div>`).join('')}
      </div>
      ${PREVIEW.items.some(e => e.estimate) ? `<div class="hint" style="margin-top:10px">
        This plan includes estimated foods, so treat the projection as approximate rather than exact.</div>` : ''}
    ` : ''}`;

  const foot = `<button class="btn" data-act="pvCancel">Discard</button>
    <button class="btn primary" data-act="pvLog" ${has ? '' : 'disabled'}>Log meal${has ? ` · ${fmt(add.calories)} kcal` : ''}</button>`;

  const mount = () => {
    $$('#pvMeal button').forEach(b => b.onclick = () => {
      PREVIEW.meal = b.dataset.m;
      PREVIEW.items.forEach(e => e.meal = PREVIEW.meal);
      drawPreview();
    });
    $('[data-act=pvAdd]').onclick = () => openAddFood(PREVIEW.meal);
    $$('[data-pvrm]').forEach(b => b.onclick = () => {
      PREVIEW.items.splice(parseInt(b.dataset.pvrm, 10), 1); drawPreview();
    });
    $$('[data-pvedit]').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.pvedit, 10), e = PREVIEW.items[i];
      openPreviewItemEditor(i, e);
    });
    $('#sheetFoot [data-act=pvCancel]').onclick = () => {
      if (!PREVIEW.items.length) { PREVIEW = null; closeSheet(true); return; }
      confirmSheet('Discard this plan?', `${PREVIEW.items.length} item${PREVIEW.items.length > 1 ? 's' : ''} will be thrown away. Nothing was logged.`,
        'Discard', () => { PREVIEW = null; closeSheet(true); render(); }, true);
    };
    $('#sheetFoot [data-act=pvLog]').onclick = () => {
      const d = stampDay(CUR);
      PREVIEW.items.forEach(e => { e.meal = PREVIEW.meal; d.entries.push(e); bumpUsage(e.foodId); });
      const n = PREVIEW.items.length;
      PREVIEW = null;
      save(); closeSheet(true); render();
      toast(`${n} item${n > 1 ? 's' : ''} logged`);
    };
  };

  // replace the preview sheet in place rather than stacking copies of it.
  // popped directly, not via closeSheet, so this is not treated as a dismissal.
  const top = sheetStack[sheetStack.length - 1];
  if (top && top.isPreview) sheetStack.pop();
  sheetStack.push({
    title: 'Plan a meal', bodyHTML: body, footHTML: foot, onMount: mount, isPreview: true,
    // whatever closes this sheet — Escape, backdrop, ✕ — the plan is abandoned.
    // Without this a staged plan outlives its sheet and silently swallows
    // everything logged afterwards.
    onDismiss: () => { if (PREVIEW) { PREVIEW = null; render(); } }
  });
  renderSheet();
}

/* ============================================================
   BACKUP REMINDER
   ============================================================ */
const BACKUP_AFTER_DAYS = 14;
function backupDue() {
  if (!DB.meta) DB.meta = {};
  const now = Date.now();
  if (DB.meta.backupSnoozeUntil && now < DB.meta.backupSnoozeUntil) return false;
  const nDays = Object.keys(DB.days).filter(k => DB.days[k].entries && DB.days[k].entries.length).length;
  if (nDays < 5) return false;                       // nothing worth losing yet
  if (!DB.meta.lastExport) return true;
  return (now - DB.meta.lastExport) > BACKUP_AFTER_DAYS * 86400000;
}
function backupBannerHTML() {
  if (!backupDue()) return '';
  const last = DB.meta.lastExport;
  const nDays = Object.keys(DB.days).filter(k => DB.days[k].entries && DB.days[k].entries.length).length;
  return `<div class="card tight" id="backupBanner" style="border-color:var(--warn)">
    <div style="display:flex;gap:11px;align-items:flex-start">
      <span style="font-size:17px;line-height:1.3">💾</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650;font-size:14.5px">Back up your data</div>
        <div style="font-size:13px;color:var(--text-2);margin-top:2px;line-height:1.45">
          ${nDays} days of tracking exist only in this browser.
          ${last ? `Last backup was ${Math.floor((Date.now() - last) / 86400000)} days ago.` : `You haven't exported one yet.`}
          Clearing website data or switching devices would lose it.</div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn sm primary" data-act="bkExport">Export backup</button>
          <button class="btn sm" data-act="bkSnooze">Remind me later</button>
        </div>
      </div>
    </div>
  </div>`;
}
function mountBackupBanner() {
  const ex = $('[data-act=bkExport]');
  if (ex) ex.onclick = () => exportJSON().then(ok => { if (ok && VIEW === 'today') render(); });
  const sn = $('[data-act=bkSnooze]');
  if (sn) sn.onclick = () => {
    if (!DB.meta) DB.meta = {};
    DB.meta.backupSnoozeUntil = Date.now() + 7 * 86400000;

  };
}

/* ============================================================
   RECALCULATE REMINDER — shown on Today once the trend line has
   moved well away from the weight the targets were built on
   ============================================================ */
function recalcNudgeHTML() {
  if (CUR !== todayKey()) return '';
  if (DB.meta && DB.meta.recalcSnoozeUntil && Date.now() < DB.meta.recalcSnoozeUntil) return '';
  const d = weightDrift();
  if (!d) return '';
  const unit = DB.settings.units === 'metric' ? 'kg' : 'lb';
  const W = kg => r1(dispWeight(kg));
  const lighter = d.diffKg < 0;
  let title, text, primary;
  if (d.goal) {
    title = 'You\'ve reached your goal weight';
    text = `Your 7-day average is ${W(d.nowKg)} ${unit}, at or under the ${W(d.goalKg)} ${unit} you set as the goal.
      The current targets still include a fat-loss deficit, so it's time to decide what comes next — a new goal, or
      a slower rate — in your details.`;
    primary = `<button class="btn sm primary" data-act="nudgeGoal">Update my details</button>`;
  } else {
    // ~10 kcal of BMR per kg, times the activity multiplier: a rough size for the drift
    const kcal = r0(Math.abs(d.diffKg) * 10 * activityMultiplier(DB.profile));
    title = `You're ${W(Math.abs(d.diffKg))} ${unit} ${lighter ? 'lighter' : 'heavier'} than your targets assume`;
    text = `They were worked out at ${W(d.atKg)} ${unit}; your 7-day average is now ${W(d.nowKg)} ${unit}.
      Maintenance ${lighter ? 'falls' : 'rises'} with bodyweight, so the plan is roughly ${kcal} kcal a day
      ${lighter ? 'looser' : 'tighter'} than intended.${DB.targets.custom
        ? ' You set the current targets by hand, so recalculating replaces them.' : ''}`;
    primary = `<button class="btn sm primary" data-act="nudgeRecalc">Recalculate targets</button>`;
  }
  return `<div class="card tight" id="recalcNudge" style="border-color:var(--accent)">
    <div style="display:flex;gap:11px;align-items:flex-start">
      <span style="font-size:17px;line-height:1.3">⚖️</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650;font-size:14.5px">${title}</div>
        <div style="font-size:13px;color:var(--text-2);margin-top:2px;line-height:1.45">${text}</div>
        <div class="btn-row" style="margin-top:10px">
          ${primary}
          <button class="btn sm" data-act="nudgeSnooze">Not now</button>
        </div>
      </div>
    </div>
  </div>`;
}
function mountRecalcNudge() {
  const rc = $('[data-act=nudgeRecalc]');
  if (rc) rc.onclick = () => { const d = weightDrift(); if (d) openRecalcConfirm(d.nowKg); };
  const gl = $('[data-act=nudgeGoal]');
  if (gl) gl.onclick = openProfileEditor;
  const sn = $('[data-act=nudgeSnooze]');
  if (sn) sn.onclick = () => {
    if (!DB.meta) DB.meta = {};
    DB.meta.recalcSnoozeUntil = Date.now() + 14 * 86400000;
    save(); render(); toast('Reminder snoozed for two weeks');
  };
}

function mountSettings() {
  const checkTargets = () => {
    const v = {}; MACROS.forEach(m => v[m] = num($('#t_' + m).value));
    const kcal = v.protein * 4 + v.carbs * 4 + v.fat * 9;
    const diff = kcal - v.calories;
    $('#tCheck').innerHTML = Math.abs(diff) > Math.max(60, v.calories * 0.07)
      ? `<span style="color:var(--warn)">Your protein, carbs and fat add up to ${fmt(kcal)} kcal, which is
         ${fmt(Math.abs(diff))} ${diff > 0 ? 'above' : 'below'} your calorie target. That's allowed — the app tracks
         them independently — but they usually should roughly match.</span>`
      : `Macros add up to ${fmt(kcal)} kcal, in line with your calorie target.`;
  };
  MACROS.forEach(m => { $('#t_' + m).oninput = checkTargets; });
  checkTargets();

  $('[data-act=saveTargets]').onclick = () => {
    const nt = { ...DB.targets, custom: true };
    MACROS.forEach(m => { nt[m] = Math.max(0, r0(num($('#t_' + m).value))); });
    const calcFloor = DB.targets.floor || r0(Math.max(DB.targets.bmr * 1.1, DB.profile.sex === 'male' ? 1500 : 1200));

    if (nt.calories < HARD_MIN_KCAL) {
      confirmSheet('Below what this app will set',
        `This app doesn't set targets below ${fmt(HARD_MIN_KCAL)} kcal — below that it can't build a coherent ` +
        `set of macros, and the number is more often a slip than an intention. It isn't a judgement about what's ` +
        `right for you, which the app can't determine. Your own calculated floor is ${fmt(calcFloor)} kcal.`,
        `Use ${fmt(calcFloor)} kcal instead`, () => {
          nt.calories = calcFloor; nt.floor = calcFloor;
          DB.targets = nt; refreshTodayTargets(); save(); render(); toast('Target set to your floor');
        }, false, () => { render(); toast('Targets not saved'); }, 'Keep current');
      return;
    }
    const commit = () => {
      nt.floor = calcFloor; DB.targets = nt;
      refreshTodayTargets();          // today follows the current plan
      save(); render(); toast('Targets saved');
    };
    // the floor is itself an estimate, so don't nag about trivial differences
    if (nt.calories < calcFloor * 0.95) {
      confirmSheet('Below your calculated floor',
        `${fmt(nt.calories)} kcal is under the ${fmt(calcFloor)} kcal floor your details imply (about 1.1× your ` +
        `estimated BMR). Eating well below that for long tends to cost muscle and makes the deficit hard to hold, ` +
        `which works against preserving what you're training for.`,
        'Use it anyway', commit, false,
        () => { render(); toast('Targets not saved'); }, 'Keep current');
      return;
    }
    if (DB.profile && nt.protein < 1.2 * proteinRefKg(DB.profile)) {
      confirmSheet('That protein target is low',
        `${nt.protein} g is under about 1.2 g per kg of your reference weight. While losing fat, protein is the ` +
        `main thing protecting muscle, so this is usually the last number to cut.`,
        'Use it anyway', commit, false,
        () => { render(); toast('Targets not saved'); }, 'Keep current');
      return;
    }
    commit();
  };
  $('[data-act=recalcTargets]').onclick = () => openRecalcConfirm();
  $('[data-act=editProfile]').onclick = openProfileEditor;

  $$('#themeSeg button').forEach(b => b.onclick = () => {
    DB.settings.theme = b.dataset.t;
    applyTheme(); save(); render();
  });
  $$('#unitsSeg button').forEach(b => b.onclick = () => {
    DB.settings.units = b.dataset.u; save(); render();
  });

  $('[data-act=export]').onclick = () => exportJSON().then(ok => { if (ok && VIEW === 'settings') render(); });
  $('[data-act=csv]').onclick = exportCSV;
  $('[data-act=import]').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importJSON(rd.result);
    rd.onerror = () => toast('Could not read that file');
    rd.readAsText(f);
    e.target.value = '';
  };
  $('[data-act=resetFoods]').onclick = () => confirmSheet('Restore starter foods?',
    'Re-adds any starter library foods you deleted, and resets edited starter foods to their original values. Your own foods, recipes and logs are untouched.',
    'Restore', () => {
      const keep = DB.foods.filter(f => !f.lib);
      DB.foods = [...starterFoods(), ...keep];
      DB.deletedLib = [];
      save(); render(); toast('Starter foods restored');
    });
  $('[data-act=wipe]').onclick = () => confirmSheet('Erase everything?',
    'This permanently deletes your profile, targets, every logged day, all custom foods, recipes and saved meals from this browser. Export a backup first if there is any chance you want it back.',
    'Erase everything', () => {
      localStorage.removeItem(KEY);
      DB = defaultDB();
      VIEW = 'today'; CUR = todayKey(); HIST = todayKey(); CAL_MONTH = null;
      applyTheme(); render(); toast('All data erased');
    }, true);
}

/* Recalculate from the profile, optionally adopting a new current weight
   first (the Today nudge passes the 7-day average). Used by the Settings
   button and the nudge so both explain the same consequences. */
function openRecalcConfirm(useWeightKg) {
  const w = useWeightKg ? r1(useWeightKg) : null;
  const unit = DB.settings.units === 'metric' ? 'kg' : 'lb';
  const parts = [];
  parts.push(w
    ? `Your current weight becomes ${r1(dispWeight(w))} ${unit} — your 7-day average — and your targets are ` +
    `replaced with fresh values from your details.`
    : 'This replaces your current targets with fresh values calculated from your profile details.');
  if (DB.profile.manualCalories) parts.push(`It also clears the manual calorie target of ` +
    `${fmt(DB.profile.manualCalories)} kcal you set — otherwise it would just be reapplied.`);
  if (DB.targets && DB.targets.custom) parts.push('The targets you set by hand will be overwritten.');
  confirmSheet('Recalculate targets?', parts.join(' '), 'Recalculate', () => {
    // a manual override persisted on the profile would survive the recalc and
    // make the button a no-op, so clearing it is part of recalculating
    DB.profile = { ...DB.profile, manualCalories: null };
    if (w) DB.profile.weightKg = w;
    DB.targets = computeTargets(DB.profile);
    refreshTodayTargets();
    save(); render(); toast('Targets recalculated');
  });
}
